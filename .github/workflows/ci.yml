name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装开发依赖（仅 eslint）
        run: npm ci
      - name: 静态检查（no-undef / 死代码）
        run: npm run lint
      - name: 单元 + 集成测试
        run: node scripts/run-tests.mjs
      - name: 冒烟（CI 模式，不依赖本机 SnowLuma）
        run: node scripts/smoke.mjs --ci
