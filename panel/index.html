<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQ 机器人控制台</title>
<link rel="stylesheet" href="./panel.css">
</head>
<body class="qq-standalone">
<div id="qq-panel" class="qq-panel-root">
<header>
  <div class="brand">🐳 QQ 机器人控制台 <small id="ver"></small><small id="panel-url" title="点一下复制" style="cursor:pointer;margin-left:10px;font-family:ui-monospace,Consolas,monospace;font-size:11px;opacity:.7"></small></div>
  <div class="pills" id="pills"><span class="pill">加载中…</span></div>
  <label class="hswitch">总开关 <span class="sw"><input type="checkbox" id="m-enabled" aria-label="机器人总开关"><i></i></span></label>
  <label class="hswitch">演练 <span class="sw"><input type="checkbox" id="m-dry" aria-label="演练模式"><i></i></span></label>
  <button class="btn" id="h-refresh" title="重载插件：应用磁盘上的代码与配置改动（连接会短暂中断）">🔄 刷新</button>
</header>

<div class="shell">
  <nav id="nav"></nav>
  <main>
    <div id="banner" class="banner"></div>
    <div id="view" class="skel">正在读取 QQ 机器人状态…</div>
  </main>
</div>

<div id="toast" class="toast"></div>
</div>
<script>
"use strict";
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const view = $('#view');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(2, '0');
const fmtTime = (ts) => { if (!ts) return '—'; const d = new Date(ts); return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); };
const ago = (ts) => { if (!ts) return '—'; const s = Math.round((Date.now()-ts)/1000); if (s<60) return s+' 秒前'; if (s<3600) return Math.round(s/60)+' 分钟前'; if (s<86400) return Math.round(s/3600)+' 小时前'; return Math.round(s/86400)+' 天前'; };
const fmtMs = (v) => { const n = Number(v)||0; if (n >= 3600000) return (n/3600000).toFixed(n%3600000?1:0)+' 小时'; if (n >= 60000) return (n/60000).toFixed(n%60000?1:0)+' 分钟'; if (n >= 1000) return (n/1000).toFixed(n%1000?1:0)+' 秒'; return n+' ms'; };
const pct = (v) => Math.round((Number(v)||0)*100)+'%';
const fmtTokens = (v) => { const n = Number(v)||0; if (n>=1e6) return (n/1e6).toFixed(2)+'M'; if (n>=1e3) return (n/1e3).toFixed(1)+'K'; return String(n); };

const NAV = [
  { id: 'overview', title: '总览', icon: '📊' },
  { id: 'features', title: '功能开关', icon: '🎛' },
  { id: 'reply', title: '回复节奏', icon: '💬', groups: ['reply'] },
  { id: 'speed', title: '速度', icon: '⚡', groups: ['speed'] },
  { id: 'proactive', title: '主动行为', icon: '🌱', groups: ['proactive'] },
  { id: 'style', title: '说话方式', icon: '🗣', groups: ['style'] },
  { id: 'sticker', title: '表情包', icon: '😄', groups: ['sticker'], special: 'stickers' },
  { id: 'vision', title: '识图', icon: '🖼', groups: ['vision'] },
  { id: 'video', title: '视频', icon: '🎬', groups: ['video'] },
  { id: 'search', title: '联网', icon: '🌐', groups: ['search'] },
  { id: 'extras', title: '更多玩法', icon: '🎲', groups: ['extras'] },
  { id: 'growth', title: '成长曲线', icon: '📈', special: 'curve' },
  { id: 'memory', title: '记忆', icon: '🧠', groups: ['memory'], special: 'memory' },
  { id: 'identity', title: '群与人', icon: '👥', groups: ['identity'], special: 'members' },
  { id: 'admin', title: '管理员', icon: '🛡', groups: ['admin'] },
  { id: 'roomcfg', title: '每群性格', icon: '🎭', special: 'roomcfg' },
  { id: 'model', title: '人设模型', icon: '🐟', groups: ['model'] },
  { id: 'diag', title: '诊断', icon: '🔬', special: 'diag' },
  { id: 'ops', title: '运维日志', icon: '🩺', groups: ['health', 'advanced'], special: 'ops' },
  { id: 'manual', title: '手动操作', icon: '🕹' },
];

/* 极简 Markdown 渲染：只支持标题/列表/加粗/行内代码 —— 画像、摘要、关系都是这种结构 */
function mdToHtml(src) {
  const lines = esc(src || '').split(/\r?\n/);
  let html = '', inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }
    let m;
    if ((m = /^#{3,}\s+(.*)$/.exec(line))) { closeList(); html += `<h5>${m[1]}</h5>`; continue; }
    if ((m = /^##\s+(.*)$/.exec(line))) { closeList(); html += `<h4>${m[1]}</h4>`; continue; }
    if ((m = /^#\s+(.*)$/.exec(line))) { closeList(); html += `<h4>${m[1]}</h4>`; continue; }
    if ((m = /^[-*]\s+(.*)$/.exec(line))) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${m[1]}</li>`;
      continue;
    }
    closeList();
    html += `<p>${line}</p>`;
  }
  closeList();
  return html
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

  const App = {
  S: null, tab: localStorage.getItem('qb:tab') || 'overview',
  usage: null, health: null, stickers: null, members: null, logsAuto: false,
  timers: [],
  dirty: false, overviewSig: '', logAuto: localStorage.getItem('qb:logAuto') === '1', graphZoom: 1,
  draft: null, draftNav: '',
  lastChance: JSON.parse(localStorage.getItem('qb:lastChances') || '{}'),
  showAdvanced: localStorage.getItem('qb:adv') === '1',
};

const API_BASE = '/qq-bot/api';
async function api(path, opts) {
  const r = await fetch(API_BASE + path, Object.assign({ credentials: 'same-origin' }, opts, {
    headers: Object.assign({ 'content-type': 'application/json' }, (opts && opts.headers) || {}),
  }));
  const text = await r.text();
  let j; try { j = JSON.parse(text); } catch { throw new Error('响应不是 JSON（HTTP ' + r.status + '）'); }
  if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
async function action(op, args) {
  const j = await api('/action', { method: 'POST', body: JSON.stringify({ op, args: args || {} }) });
  return j.result;
}
let toastTimer = null;
function toast(msg, kind) {
  const el = $('#toast'); if (!el) return;
  el.textContent = msg;
  el.className = 'toast show ' + (kind || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, kind === 'err' ? 4200 : 2200);
}

async function refresh(opts) {
  opts = opts || {};
  try {
    App.S = await api('/state');
    App.usage = App.S.usage || null;
    App.health = App.S.health || App.health;
    renderHeader();
    if (!opts.lite) return renderActive(opts);
    // 轮询只刷新数字：保留滚动位置，别让用户每 5 秒被弹回顶部
    if (App.tab === 'overview') {
      // 数据没变就别重渲染（否则"最近消息"会闪、选中复制会被清掉）
      const st = App.S.stats || {};
      const sig = JSON.stringify([
        st.msgsIn, st.replies, st.skipped, st.sends, st.llmCalls, st.stickersSent,
        (App.S.rooms || []).map((r) => [r.roomId, r.msgs, r.lastActivityAt, (r.decision && r.decision.reason) || '', (r.recent || []).length, r.facts]),
      ]);
      if (sig === App.overviewSig) return;
      App.overviewSig = sig;
      const mainEl = document.querySelector('#qq-panel main');
      const sc = mainEl ? mainEl.scrollTop : 0;
      renderActive(opts);
      if (mainEl) mainEl.scrollTop = sc;
    }
  } catch (e) {
    toast('读取状态失败：' + e.message, 'err');
    if (!App.S) view.innerHTML = '<div class="card">读取状态失败：' + esc(e.message) + '<br><br><button class="btn" onclick="location.reload()">重试</button></div>';
  }
}

function renderHeader() {
  const S = App.S; if (!S) return;
  const pu = $('#panel-url');
  if (pu) {
    const url = location.origin + '/qq-bot';
    if (pu.textContent !== url) {
      pu.textContent = url;
      pu.onclick = () => { try { navigator.clipboard.writeText(url); toast('地址已复制', 'ok'); } catch { toast('复制失败', 'err'); } };
    }
  }
  $('#ver').textContent = 'v' + (S.version || '') +
    (S.panelBuiltAt ? ' · 面板 ' + new Date(S.panelBuiltAt).toLocaleString('zh-CN', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '');
  const c = S.connection || {}, st = S.stats || {};
  const pills = [
    { t: 'SnowLuma', ok: !!c.connected, text: c.connected ? '已连接' : '未连接' },
    { t: '账号', ok: !!c.self, text: c.self ? (c.self.nickname || '') + ' ' + c.self.user_id : '未取到' },
    { t: '收/回', ok: st.msgsIn > 0 ? true : null, text: (st.msgsIn || 0) + ' / ' + (st.replies || 0) },
    { t: '首字', ok: null, text: (st.lastFirstTokenMs || 0) + 'ms' },
  ];
  $('#pills').innerHTML = pills.map(p => '<span class="pill"><span class="dot ' + (p.ok === true ? 'ok' : p.ok === false ? 'bad' : '') + '"></span>' + esc(p.t) + ' <b>' + esc(p.text) + '</b></span>').join('');
  $('#m-enabled').checked = !!S.config.enabled;
  $('#m-dry').checked = !!S.config.dryRun;
  const b = $('#banner');
  if (!S.config.enabled) { b.className = 'banner bad show'; b.textContent = '⛔ 机器人已停用：仍会收消息、记上下文，但不回复。'; }
  else if (S.config.dryRun) { b.className = 'banner warn show'; b.textContent = '🧪 演练模式：照常调模型，但不发送。'; }
  else { b.className = 'banner'; b.textContent = ''; }
}

function renderNav() {
  $('#nav').innerHTML = NAV.map(n => '<a href="#' + n.id + '" data-tab="' + n.id + '" class="' + (App.tab === n.id ? 'on' : '') + '">' + n.icon + ' ' + esc(n.title) + '</a>').join('');
  $$('#nav a').forEach(a => a.onclick = (e) => {
    e.preventDefault();
    if (a.dataset.tab === App.tab) return;
    if (!leaveGuard()) return;
    App.draft = null;
    App.draftNav = '';
    App.tab = a.dataset.tab;
    localStorage.setItem('qb:tab', App.tab);
    renderNav(); renderActive({});
  });
}

/* 有未保存修改时离开前问一句（P1：避免切页/切开关把改动冲掉） */
function leaveGuard() {
  // 参数页的未保存修改
  if (App.dirty) {
    const ok = confirm('这一页有还没保存的参数修改，确定离开吗？');
    if (!ok) return false;
    App.dirty = false;
  }
  // 群成员改名（和参数是两套保存流程，分开提示）
  if (App.memberDirty) {
    const ok2 = confirm('群成员昵称有还没保存的修改，确定离开吗？（回来还能接着改）');
    if (!ok2) return false;
    App.memberDirty = false;
  }
  return true;
}

function renderActive() {
  if (!App.S) return;
  // 换页时清掉上一页留下的定时器（日志自动刷新这类）
  (App.timers || []).forEach(clearInterval);
  App.timers = [];
  view.oninput = null;
  view.onchange = null;
  App.dirty = false;
  const nav = NAV.find(n => n.id === App.tab) || NAV[0];
  App.tab = nav.id;
  // 每个模块单独兜底：某一页挂了就把它自己报出来，别让按钮"凭空消失"
  const safe = (label, fn) => {
    try {
      fn();
    } catch (e) {
      console.error('[qq-bot panel] ' + label + ' 渲染失败', e);
      const box = document.createElement('div');
      box.className = 'card';
      box.style.borderLeftColor = 'var(--bad)';
      box.innerHTML = `<b>「${esc(label)}」模块加载失败</b><div class="small muted" style="margin-top:4px">${esc(String(e && e.message || e))}</div>
        <div class="small muted" style="margin-top:4px">刷新页面可重试；如果反复出现，把这段报错发我。</div>`;
      view.appendChild(box);
    }
  };
  if (nav.id === 'overview') return safe('总览', renderOverview);
  if (nav.id === 'features') return safe('功能开关', renderFeatures);
  if (nav.id === 'manual') return safe('手动操作', renderManual);
  if (nav.id === 'diag') return safe('诊断', renderDiag);
  if (nav.special === 'roomcfg') return safe('每群性格', renderRoomCfg);
  // 这一页没有 groups，不能放进下面的分组块里
  if (nav.special === 'curve') return safe('成长曲线', renderCurveExtra);
  if (nav.groups) {
    safe('参数页', () => renderParams(nav));
    if (nav.special === 'stickers') safe('图库', renderStickerExtra);
    if (nav.special === 'memory') safe('长期记忆', renderMemoryExtra);
    if (nav.special === 'members') safe('群成员', renderMembersExtra);
    if (nav.special === 'ops') safe('日志与配置', renderOpsExtra);
  }
}

/* ── 总览 ─────────────────────────────────────────── */
function renderOverview() {
  const S = App.S, st = S.stats || {}, conn = S.connection || {};
  const h = App.health || S.health || { items: [], bad: [], warn: [] };
  const okCount = (h.items || []).filter(i => i.level === 'ok').length;
  const rooms = S.rooms || [];
  const feed = [];
  rooms.forEach(r => (r.recent || []).forEach(m => feed.push(Object.assign({ room: r.roomName || r.roomId }, m))));
  feed.sort((a, b) => (b.ts || 0) - (a.ts || 0));

  view.innerHTML = `
    <h2>总览 <span class="muted small">${esc(ago(S.at))}更新</span></h2>
    <div class="grid">
      <div class="card"><div class="t">📥 收到 / 回复</div><div class="k">${st.msgsIn || 0} <span class="muted" style="font-size:13px">/ ${st.replies || 0}</span></div>
        <div class="d">跳过 ${st.skipped || 0} · 拦截 ${st.blocked || 0} · 敷衍 ${st.canned || 0}</div></div>
      <div class="card"><div class="t">📤 发出</div><div class="k">${st.sends || 0}</div>
        <div class="d">文字 ${st.sends || 0} · 表情 ${st.stickersSent || 0} · LLM ${st.llmCalls || 0}（失败 ${st.llmErrors || 0}）</div></div>
      <div class="card"><div class="t">⚡ 延迟</div><div class="k">${st.lastFirstTokenMs || 0} <span class="muted" style="font-size:13px">ms</span></div>
        <div class="d">模型侧 ${st.lastLatencyMs || 0}ms · 倍率 ×${S.config.delayScale}</div></div>
      <div class="card"><div class="t">😄 表情包库</div><div class="k">${(S.stickers && S.stickers.count) || 0}</div>
        <div class="d">可用 · 共 ${(S.stickers && S.stickers.total) || 0} 张（失效 ${(S.stickers && S.stickers.bad) || 0}，会自动清理）</div></div>
      <div class="card"><div class="t">🪙 Token 用量</div><div class="k">${fmtTokens((App.usage && App.usage.today && App.usage.today.total) || 0)}</div>
        <div class="d">今日 · 累计 ${fmtTokens((App.usage && App.usage.total) || 0)} · ${(App.usage && App.usage.calls) || 0} 次</div></div>
      <div class="card"><div class="t">🩺 健康</div><div class="k" style="font-size:16px">${(h.items || []).length ? (h.bad && h.bad.length ? '❌ ' + h.bad.length + ' 项异常' : (h.warn && h.warn.length ? '⚠️ ' + h.warn.length + ' 项提醒' : '✅ 正常')) : '未检查'}</div>
        <div class="d">${(h.items || []).length ? okCount + '/' + h.items.length + ' 项通过 · ' + ago(h.at) : '点「立即自检」'}</div></div>
    </div>

    <div class="row" style="margin:14px 0 4px">
      <button class="btn" id="btn-refresh">刷新</button>
      <button class="btn primary" id="btn-check">立即自检</button>
      <span class="muted small">WS ${esc(conn.wsUrl || '-')} · 轮询 ${S.config.pollMs}ms</span>
    </div>

    ${(App.usage && App.usage.days && App.usage.days.length) ? `<div class="section"><div class="hd">🪙 最近 7 天用量 <span class="muted">token / 天</span></div>
      <div class="card"><div style="display:flex;align-items:flex-end;gap:10px;height:96px">
        ${(() => {
          const days = App.usage.days;
          const max = Math.max(1, ...days.map(d => d.total || 0));
          return days.map(d => {
            const px = Math.max(6, Math.round(((d.total || 0) / max) * 70));
            return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px" title="${d.total || 0} token · ${d.calls || 0} 次">
              <div style="width:100%;height:${px}px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:5px"></div>
              <span class="small muted">${esc(String(d.day).slice(5))}</span></div>`;
          }).join('');
        })()}
      </div></div></div>` : ''}

    <div class="section"><div class="hd">👥 各群状态 <span class="muted">${rooms.length} 个</span></div>
      ${rooms.length ? `<table class="table"><thead><tr><th>群</th><th>10 分钟额度</th><th>最后活动</th><th>记忆</th><th class="col-decision">最近决策</th></tr></thead><tbody>
        ${rooms.map(r => `<tr><td title="${esc(r.roomId)}"><b>${esc(r.roomName || r.roomId)}</b> ${r.allowed ? '' : '<span class="muted">（未授权）</span>'}</td>
          <td>${(r.policy && r.policy.replies10m) || 0}/${(r.policy && r.policy.maxRepliesPer10Min) || 0}</td>
          <td>${esc(ago(r.lastActivityAt))}</td>
          <td>${r.msgs || 0} 条 / ${r.facts || 0} 条长期</td>
          <td class="col-decision">${esc((r.decision && r.decision.reason) || '—')}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">还没有收到过消息（群太安静，或还没连上 SnowLuma）。</div>'}
    </div>

    <div class="section"><div class="hd">💬 最近消息</div>
      <div class="feed">${feed.slice(0, 24).map(m => `<div class="line"><span class="time">${esc(fmtTime(m.ts))}</span>
        <span class="who">${m.isSelf ? '🐳 我' : esc(m.who || '?')}</span>
        <span class="txt">${esc(m.text)}</span><span class="muted small" style="margin-left:auto">${esc(m.room)}</span></div>`).join('') || '<div class="empty">暂无</div>'}</div>
    </div>`;

  $('#btn-refresh').onclick = () => refresh();
  $('#btn-check').onclick = runSelfcheck;
}

async function runSelfcheck() {
  const btn = $('#btn-check'); if (btn) { btn.disabled = true; btn.textContent = '检查中…'; }
  try {
    App.health = await action('selfcheck');
    App.S.health = App.health;
    toast('自检完成：' + (App.health.bad.length ? App.health.bad.length + ' 项异常' : '关键项正常'), App.health.bad.length ? 'err' : 'ok');
    if (App.tab === 'overview') renderOverview();
    else if (App.tab === 'diag') renderDiag();
    renderHeader();
  } catch (e) { toast('自检失败：' + e.message, 'err'); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '立即自检'; } }
}

/* ── 功能开关 ─────────────────────────────────────── */
function featureOn(f) {
  const v = App.S.config[f.key];
  return f.kind === 'chance' ? Number(v) > 0 : (f.key === 'quietHours' ? !!(v && String(v).trim()) : !!v);
}
function renderFeatures() {
  const S = App.S, feats = S.features || [];
  view.innerHTML = `<h2>功能开关 <span class="muted small">${feats.filter(featureOn).length}/${feats.length} 开启</span></h2>
    <div class="muted small" style="margin-bottom:12px">点开关即时生效。灰色卡片表示已关闭。</div>
    <div class="grid">${feats.map(f => {
      const on = featureOn(f);
      return `<div class="card fcard ${on ? '' : 'off'}">
        <div class="top"><div class="ico">${f.icon}</div><div class="grow">
          <div class="t">${esc(f.title)}</div><div class="d">${esc(f.desc)}</div></div>
          <label class="sw"><input type="checkbox" data-feature="${f.id}" aria-label="${esc(f.title)}" ${on ? 'checked' : ''}><i></i></label></div>
        <div class="small muted" style="margin-top:8px">${f.kind === 'chance' ? '概率 ' + pct(S.config[f.key]) : (on ? '已开启' : '已关闭')}</div>
      </div>`;
    }).join('')}</div>`;
  $$('input[data-feature]').forEach(el => {
    el.onchange = async () => {
      const f = feats.find(x => x.id === el.dataset.feature); if (!f) return;
      const on = el.checked;
      let v = on;
      if (f.kind === 'chance') {
        const cur = Number(S.config[f.key]) || 0;
        if (cur > 0) App.lastChance[f.key] = cur;
        v = on ? (App.lastChance[f.key] || f.defaultChance || 0.2) : 0;
        localStorage.setItem('qb:lastChances', JSON.stringify(App.lastChance));
      } else if (f.key === 'quietHours') {
        v = on ? (prompt('安静时段，如 23:00-08:00', S.config.quietHours || '23:00-08:00') || '') : '';
        if (on && !v) { el.checked = false; return; }
      }
      try {
        await api('/config', { method: 'POST', body: JSON.stringify({ patch: { [f.key]: v } }) });
        S.config[f.key] = v;
        toast((on ? '已开启：' : '已关闭：') + f.title, 'ok');
        renderFeatures(); renderHeader();
      } catch (e) { el.checked = !on; toast('保存失败：' + e.message, 'err'); }
    };
  });
}

/* ── 参数表单 ─────────────────────────────────────── */
function humanValue(k, v, m) {
  if (m && m.unit === 'ms') return '≈ ' + fmtMs(v);
  if (m && m.min === 0 && m.max === 1) return pct(v);
  return '';
}
function fieldHtml(k, m) {
  const S = App.S, v = S.config[k];
  const label = esc(m.label || k), help = m.help ? `<div class="help">${esc(m.help)}</div>` : '';
  if (m.type === 'bool') {
    return `<div class="field"><div class="lab">${label}</div>
      <div class="ctl"><label class="sw"><input type="checkbox" data-k="${k}" data-t="bool" ${v ? 'checked' : ''}><i></i></label>
      <span class="muted small" data-bv="${k}">${v ? '已开启' : '已关闭'}</span></div>${help}</div>`;
  }
  if (m.type === 'number') {
    const min = m.min == null ? '' : `min="${m.min}"`, max = m.max == null ? '' : `max="${m.max}"`, step = m.step == null ? 'step="1"' : `step="${m.step}"`;
    return `<div class="field"><div class="lab">${label}</div>
      <div class="ctl"><input type="range" data-range="${k}" ${min} ${max} ${step} value="${Number(v) || 0}">
        <input class="num" type="number" data-k="${k}" data-t="number" ${min} ${max} ${step} value="${Number(v) || 0}">
        <span class="unit">${esc(m.unit || '')}</span><span class="muted small" data-hv="${k}">${humanValue(k, v, m)}</span></div>${help}</div>`;
  }
  if (m.type === 'enum') {
    return `<div class="field"><div class="lab">${label}</div>
      <div class="ctl"><select data-k="${k}" data-t="enum">${(m.options || []).map(o => `<option value="${esc(o)}" ${String(v) === String(o) ? 'selected' : ''}>${esc(o === '' ? '（默认/留空）' : o)}</option>`).join('')}</select></div>${help}</div>`;
  }
  if (m.type === 'textarea') {
    return `<div class="field"><div class="lab">${label}</div>
      <div class="ctl"><textarea data-k="${k}" data-t="text">${esc(v)}</textarea></div>${help}</div>`;
  }
  if (m.type === 'csv') {
    const val = Array.isArray(v) ? v.join(', ') : String(v || '');
    return `<div class="field"><div class="lab">${label}</div>
      <div class="ctl"><input type="text" style="flex:1;min-width:220px" data-k="${k}" data-t="csv" value="${esc(val)}" placeholder="逗号分隔"></div>${help}</div>`;
  }
  return `<div class="field"><div class="lab">${label}</div>
    <div class="ctl"><input type="text" style="flex:1;min-width:220px" data-k="${k}" data-t="text" value="${esc(v == null ? '' : v)}" ${m.type === 'quiet' ? 'placeholder="23:00-08:00"' : ''}></div>${help}</div>`;
}

function renderParams(nav) {
  const S = App.S;
  const meta = S.meta || {};
  const groups = (S.groups || []).filter(g => nav.groups.includes(g.id));
  const advancedCount = Object.entries(meta).filter(([k, m]) => nav.groups.includes(m.group) && m.advanced).length;
  view.innerHTML = `<h2>${nav.icon} ${esc(nav.title)}</h2>
    ${groups.map(g => {
      const fields = Object.entries(meta).filter(([k, m]) => m.group === g.id && (App.showAdvanced || !m.advanced));
      return `<div class="section"><div class="hd">${g.icon} ${esc(g.title)} <span class="muted">${esc(g.desc || '')}</span></div>
        <div class="card">${fields.map(([k, m]) => fieldHtml(k, m)).join('') || '<div class="empty">这个分组还没有参数</div>'}</div></div>`;
    }).join('')}
    ${advancedCount ? `<div class="row savebar"><label class="hswitch">显示高级参数 <span class="sw"><input type="checkbox" id="adv-toggle" ${App.showAdvanced ? 'checked' : ''}><i></i></span></label>
      <button class="btn primary" id="btn-save">保存本页</button><span class="muted small" id="save-hint"></span></div>` : '<div class="row savebar"><button class="btn primary" id="btn-save">保存本页</button><span class="muted small" id="save-hint"></span></div>'}`;

  const adv = $('#adv-toggle');
  if (adv) adv.onchange = () => {    // 切换"显示高级参数"会整页重渲染：先把当前编辑值存下来，渲染完再填回去，别丢改动
    const snap = {};
    $$('[data-k]').forEach(el => { snap[el.dataset.k] = el.dataset.t === 'bool' ? el.checked : el.value; });
    App.showAdvanced = adv.checked;
    localStorage.setItem('qb:adv', adv.checked ? '1' : '0');
    renderParams(nav);
    $$('[data-k]').forEach(el => {
      const k = el.dataset.k;
      if (!(k in snap)) return;
      if (el.dataset.t === 'bool') el.checked = !!snap[k];
      else el.value = snap[k];
    });
  };

  // 滑杆 ↔ 数字框 ↔ 右侧可读值 三者同步（之前只同步了前两者，右侧文字一直不变）
  const syncHuman = (k, val) => {
    const m = (App.S.meta || {})[k] || {};
    const hv = view.querySelector(`[data-hv="${k}"]`);
    if (!hv) return;
    const raw = String(val == null ? '' : val).trim();
    if (raw === '' || Number.isNaN(Number(raw))) { hv.textContent = ''; return; }
    hv.textContent = humanValue(k, Number(raw), m);
  };
  // 草稿保护：页面重渲染（刷新/切高级参数/切开关）后把没保存的编辑填回去，
  // 之前出现过"改完人设点保存，存下去的却是旧文本"。
  if (App.draftNav === nav.id && App.draft) {
    $$('[data-k]').forEach(el => {
      const k = el.dataset.k;
      if (!(k in App.draft)) return;
      if (el.dataset.t === 'bool') el.checked = !!App.draft[k];
      else el.value = App.draft[k];
      if (el.dataset.t === 'number') syncHuman(k, el.value);
    });
    App.dirty = true;
    const h = $('#save-hint');
    if (h) h.textContent = '● 有未保存修改（草稿已保留）';
  }
  $$('input[data-range]').forEach(r => {
    const k = r.dataset.range;
    r.oninput = () => {
      const n = view.querySelector('input[data-k="' + k + '"]');
      if (n) n.value = r.value;
      syncHuman(k, r.value);
    };
  });
  $$('input[data-k]').forEach(el => {
    const k = el.dataset.k;
    if (el.dataset.t === 'bool') {
      el.onchange = () => {
        const bv = view.querySelector(`[data-bv="${k}"]`);
        if (bv) bv.textContent = el.checked ? '已开启' : '已关闭';
      };
    }
    if (el.dataset.t === 'number') {
      el.oninput = () => {
        const r = view.querySelector('input[data-range="' + k + '"]');
        if (r) r.value = el.value;
        syncHuman(k, el.value);
      };
    }
  });

  // 任何改动都标记 dirty 并存草稿：切页/切开关/重渲染都不会丢编辑
  // 注意：只认参数字段（[data-k]）——群成员改名、记忆输入框不该触发"未保存"
  const captureDraft = (e) => {
    const el = e && e.target
    if (!el || !el.dataset || !('k' in el.dataset)) return
    App.draftNav = nav.id;
    App.draft = {};
    $$('[data-k]').forEach(el => {
      App.draft[el.dataset.k] = el.dataset.t === 'bool' ? el.checked : el.value;
    });
    App.dirty = true;
    const h = $('#save-hint');
    if (h) h.textContent = '● 有未保存修改';
  };
  view.oninput = captureDraft;
  view.onchange = captureDraft;

  $('#btn-save').onclick = async () => {
    const patch = {};
    const skipped = [];
    $$('[data-k]').forEach(el => {
      const k = el.dataset.k, t = el.dataset.t;
      if (t === 'bool') patch[k] = el.checked;
      else if (t === 'number') {
        const raw = String(el.value).trim();
        // 输入框被清空时不要偷偷写成 0，跳过并提示
        if (raw === '' || Number.isNaN(Number(raw))) { skipped.push(k); return; }
        patch[k] = Number(raw);
      } else if (t === 'csv') patch[k] = el.value.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean);
      else patch[k] = el.value;
    });
    // 完全没改动就别提交，并明确提示（这正是"改了人设却没生效"最常见的原因）
    const noChange = !skipped.length && Object.entries(patch).every(([k, v]) => {
      const cur = S.config[k];
      const a = Array.isArray(v) ? v.join(',') : String(v);
      const b = Array.isArray(cur) ? cur.join(',') : String(cur == null ? '' : cur);
      return a === b;
    });
    if (noChange) {
      toast('没有检测到任何改动：如果你刚改过人设，多半是编辑被页面刷新冲掉了，请重新输入后再保存', 'err');
      return;
    }
    try {
      const r = await api('/config', { method: 'POST', body: JSON.stringify({ patch }) });
      App.dirty = false;
      App.draft = null;
      App.draftNav = '';
      // 夹取反馈：服务端会按 min/max 调整，界面上要让人知道
      const adjusted = [];
      for (const [k, v] of Object.entries(patch)) {
        const got = (r.applied || {})[k];
        if (got === undefined) continue;
        const a = Array.isArray(got) ? got.join(',') : String(got);
        const b = Array.isArray(v) ? v.join(',') : String(v);
        if (a !== b) adjusted.push(`${k} ${b}→${a}`);
      }
      const msg = '已保存 ' + Object.keys(r.applied || {}).length + ' 项'
        + (skipped.length ? `（${skipped.length} 项为空已跳过）` : '')
        + (adjusted.length ? `；${adjusted.length} 项按范围调整：${adjusted.slice(0, 3).join('、')}` : '');
      toast(msg, 'ok');
      const hintEl = $('#save-hint');
      if (hintEl) hintEl.textContent = '已保存 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
      await refresh();
      if (App.tab === 'overview') { /* 已重建 */ }
    } catch (e) { toast('保存失败：' + e.message, 'err'); }
  };
}

/* ── 成长曲线（情绪 + 亲密度） ───────────────────── */
const MOOD_COLORS = {
  困: '#7c8cff', 馋: '#ff9f43', 得意: '#ffcc00', 委屈: '#a29bfe',
  被惹到: '#ff6b6b', 无聊: '#95a5a6', 开心: '#2ecc71', 平静: '#b2bec3',
};

async function renderCurveExtra() {
  const S = App.S;
  const rooms = (S.rooms || []).filter(r => r.isGroup || r.allowed);
  view.innerHTML = `<h2>📈 情绪与亲密度</h2>
    <div class="card">
      <div class="row"><select id="cv-room">${rooms.map(r => `<option value="${esc(r.roomId)}">${esc(r.roomName || r.roomId)}</option>`).join('') || '<option value="">（没有会话）</option>'}</select>
        <span class="muted small" id="cv-hint"></span></div>
      <div class="muted small" style="margin-top:6px">每天回复时记一格：当天出现过的心情 + 最高亲密度。只对托管会话有记录。</div>
      <div id="cv-box" style="margin-top:14px"></div>
    </div>`;
  const load = async () => {
    const room = ($('#cv-room') || {}).value;
    if (!room) return;
    try {
      const d = await action('curve.get', { room });
      const days = d.days || [];
      const hint = $('#cv-hint');
      if (hint) hint.textContent = days.length ? `${days.length} 天有记录` : '还没有记录（多聊几天就有了）';
      paintCurve(days);
    } catch (e) {
      const hint = $('#cv-hint');
      if (hint) hint.textContent = '读取失败：' + e.message;
    }
  };
  const paintCurve = (days) => {
    const box = $('#cv-box');
    if (!box) return;
    if (!days.length) { box.innerHTML = '<div class="empty">暂无数据</div>'; return; }
    const W = 640, H = 180, pad = 24;
    const maxTotal = Math.max(1, ...days.map(d => Object.values(d.m || {}).reduce((a, b) => a + b, 0)));
    const bw = Math.max(8, Math.floor((W - pad * 2) / days.length) - 6);
    // 情绪堆叠柱
    let bars = '';
    days.forEach((d, i) => {
      const x = pad + i * ((W - pad * 2) / days.length);
      let y = H - pad;
      for (const [mood, n] of Object.entries(d.m || {})) {
        const hgt = Math.round((n / maxTotal) * (H - pad * 2));
        y -= hgt;
        bars += `<rect x="${x}" y="${y}" width="${bw}" height="${hgt}" fill="${MOOD_COLORS[mood] || '#ccc'}" rx="2"/>`;
      }
      bars += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="9" fill="currentColor" opacity=".6">${d.day.slice(5)}</text>`;
    });
    // 亲密度折线
    const maxBond = Math.max(1, ...days.map(d => d.bond || 0));
    const pts = days.map((d, i) => {
      const x = pad + i * ((W - pad * 2) / days.length) + bw / 2;
      const y = H - pad - ((d.bond || 0) / maxBond) * (H - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const legend = Object.keys(MOOD_COLORS).filter(m => days.some(d => d.m && d.m[m]))
      .map(m => `<span style="margin-right:10px"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${MOOD_COLORS[m]};margin-right:4px"></i>${m}</span>`).join('');
    box.innerHTML = `
      <div class="hd" style="font-weight:600">情绪分布</div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;color:var(--text)">${bars}</svg>
      <div class="small muted" style="margin:4px 0 14px">${legend || '（还没有心情记录）'}</div>
      <div class="hd" style="font-weight:600">亲密度（当天最高）</div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;color:var(--text)">
        <polyline points="${pts}" fill="none" stroke="#4d6bfe" stroke-width="2"/>
        ${days.map((d, i) => {
          const x = pad + i * ((W - pad * 2) / days.length) + bw / 2;
          const y = H - pad - ((d.bond || 0) / maxBond) * (H - pad * 2);
          return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#4d6bfe"/>`;
        }).join('')}
      </svg>`;
  };
  $('#cv-room').onchange = load;
  load();
}

        ? r.facts.map(f => `<div class="mem-row" style="display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)">
            <span class="mem-text" style="flex:1">• ${esc(f.text || f)}</span>
            <span class="small muted">${f.at ? new Date(f.at).toLocaleDateString('zh-CN') : ''}</span>
            <button class="btn" data-memedit="${esc(f.text || f)}" style="padding:2px 8px">改</button>
            <button class="btn" data-memdel="${esc(f.text || f)}" style="padding:2px 8px">删</button></div>`).join('')
        : '<div class="empty">还没有长期记忆（可以手动加，或让模型提炼）</div>';
      $$('#mem-list [data-memdel]').forEach(b => b.onclick = async () => {
        try { await action('memory.del', { room: room(), text: b.dataset.memdel }); load(); }
        catch (e) { toast('删除失败：' + e.message, 'err'); }
      });
      // 单条就地编辑：改 → 输入框 + 保存/取消（回车保存、Esc 取消）
      $$('#mem-list [data-memedit]').forEach(b => {
        const startEdit = () => {
          const row = b.closest('.mem-row');
          const oldText = b.dataset.memedit;
          if (!row || row.querySelector('input.mem-edit')) return;
          const span = row.querySelector('.mem-text');
          if (!span) return;
          const inp = document.createElement('input');
          inp.type = 'text';
          inp.className = 'mem-edit';
          inp.value = oldText;
          inp.style.flex = '1';
          inp.style.minWidth = '160px';
          span.replaceWith(inp);
          inp.focus();
          inp.select();
          const cancel = document.createElement('button');
          cancel.className = 'btn';
          cancel.style.padding = '2px 8px';
          cancel.textContent = '取消';
          cancel.onclick = () => load();
          b.textContent = '保存';
          b.onclick = (ev) => { ev.preventDefault(); saveEdit(); };
          const del = row.querySelector('[data-memdel]');
          if (del) row.insertBefore(cancel, del); else row.appendChild(cancel);
          const saveEdit = async () => {
            const text = String(inp.value || '').trim();
            if (!text) return toast('内容不能为空', 'err');
            if (text === oldText) return load();
            try {
              await action('memory.update', { room: room(), old: oldText, text });
              toast('已保存修改', 'ok');
              load();
            } catch (e) { toast('保存失败：' + e.message, 'err'); }
          };
          inp.onkeydown = (ev) => {
            if (ev.key === 'Enter') { ev.preventDefault(); saveEdit(); }
            if (ev.key === 'Escape') { ev.preventDefault(); load(); }
          };
        };
        b.onclick = (ev) => { ev.preventDefault(); startEdit(); };
      });
      const pre = $('#mem-text'); if (pre) pre.style.display = 'none';
    } catch (e) { toast('读取失败：' + e.message, 'err'); }
  };
  $('#mem-show').onclick = async () => {
    if (!room()) return;
    try {
      const r = await action('memory.profile', { room: room() });
      const box = $('#mem-text'); if (!box) return;
      box.style.display = 'block';
      box.innerHTML = mdToHtml([
        `目录：\`${r.dir || ''}\``,
        '## 画像 profile.md',
        r.profile || '（还没有，点「生成画像」）',
        '## 摘要 summary.md',
        r.summary || '（还没有，点「生成摘要」）',
        '## 关系 relations.md',
        r.relations || '（还没有，点「分析关系」）',
      ].join('\n\n'));
    } catch (e) { toast('读取失败：' + e.message, 'err'); }
  };
  $('#mem-profile').onclick = async () => {
    if (!room()) return;
    try { await action('memory.regenProfile', { room: room() }); toast('画像已更新', 'ok'); $('#mem-show').click(); }
    catch (e) { toast('生成失败：' + e.message, 'err'); }
  };
  $('#mem-summary').onclick = async () => {
    if (!room()) return;
    try { await action('memory.regenSummary', { room: room() }); toast('摘要已更新', 'ok'); $('#mem-show').click(); }
    catch (e) { toast('生成失败：' + e.message, 'err'); }
  };
  $('#mem-relations').onclick = async () => {
    if (!room()) return;
    try { await action('memory.regenRelations', { room: room() }); toast('关系分析已更新', 'ok'); $('#mem-show').click(); }
    catch (e) { toast('分析失败：' + e.message, 'err'); }
  };
  const renderGraph = (g) => {
    const box = $('#mem-graph-box'); if (!box) return;
    const zoomRow = $('#mem-graph-zoom');
    if (!g || !g.nodes || !g.nodes.length) {
      box.innerHTML = '<div class="empty">还没有关系图（先点「分析关系」）</div>';
      if (zoomRow) zoomRow.style.display = 'none';
      return;
    }
    if (zoomRow) zoomRow.style.display = 'flex';
    const zl = $('#mem-graph-zoom-label'); if (zl) zl.textContent = Math.round(App.graphZoom * 100) + '%';
    const W = 560, H = 340, cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 72, n = g.nodes.length;
    const pos = new Map(g.nodes.map((x, i) => [x.id, {
      x: cx + R * Math.cos(i / n * Math.PI * 2 - Math.PI / 2),
      y: cy + R * Math.sin(i / n * Math.PI * 2 - Math.PI / 2),
    }]));
    const maxW = Math.max(1, ...g.edges.map(e => e.w)), maxM = Math.max(1, ...g.nodes.map(x => x.msgs));
    const lines = g.edges.map(e => {
      const a = pos.get(e.a), b = pos.get(e.b); if (!a || !b) return '';
      return `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="currentColor" stroke-opacity="${(0.15 + 0.5 * e.w / maxW).toFixed(2)}" stroke-width="${(1 + 5 * e.w / maxW).toFixed(1)}"/>`;
    }).join('');
    const dots = g.nodes.map(x => {
      const p = pos.get(x.id), r = 10 + 14 * x.msgs / maxM;
      const nm = String(x.name || x.id);
      const short = nm.length > 6 ? nm.slice(0, 6) + '…' : nm;
      return `<g><title>${esc(nm)}（${x.msgs} 条）</title><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}" fill="currentColor" fill-opacity=".8"/><text x="${p.x.toFixed(1)}" y="${(p.y + r + 14).toFixed(1)}" text-anchor="middle" font-size="11" fill="currentColor">${esc(short)}</text></g>`;
    }).join('');
    const w = Math.round(W * App.graphZoom), h = Math.round(H * App.graphZoom);
    box.innerHTML = `<div style="overflow:auto;max-width:100%"><svg viewBox="0 0 ${W} ${H}" width="${w}" height="${h}" style="color:var(--text)">${lines}${dots}</svg></div>`;
  };
  $$('#mem-graph-zoom [data-zoom]').forEach(b => b.onclick = () => {
    const d = Number(b.dataset.zoom);
    App.graphZoom = d === 0 ? 1 : Math.min(2.4, Math.max(0.6, App.graphZoom + d * 0.2));
    if (App.lastGraph) renderGraph(App.lastGraph);
  });
  $('#mem-graph').onclick = async () => {
    if (!room()) return;
    try { const g = await action('memory.graph', { room: room() }); App.lastGraph = g; renderGraph(g); }
    catch (e) { toast('读取关系图失败：' + e.message, 'err'); }
  };
  $('#mem-export').onclick = async () => {
    if (!room()) return;
    try {
      const r = await action('memory.export', { room: room() });
      const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), room: room(), files: r.files }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'memory-' + room() + '.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 8000);
      toast('已导出（服务端也留了一份：' + r.file + '）', 'ok');
    } catch (e) { toast('导出失败：' + e.message, 'err'); }
  };
  $('#mem-load').onclick = load;
  $('#mem-room').onchange = load;
  const saveMemory = async () => {
    const t = ($('#mem-add') || {}).value; const text = String(t || '').trim();
    if (!text) return toast('先写一条内容再保存', 'err');
    if (!room()) return toast('没有可用的会话', 'err');
    try {
      await action('memory.add', { room: room(), add: text });
      const box = $('#mem-add'); if (box) box.value = '';
      load(); toast('已保存到长期记忆', 'ok');
    } catch (e) { toast('保存失败：' + e.message, 'err'); }
  };
  $('#mem-add-btn').onclick = saveMemory;
  if ($('#mem-add')) $('#mem-add').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); saveMemory(); } };
  $('#mem-extract').onclick = async () => {
    try {
      const r = await action('memory.extract', { room: room() });
      toast(r.ok ? `提炼出 ${r.added} 条` : r.error, r.ok ? 'ok' : 'err');
      load();
    } catch (e) { toast('提炼失败：' + e.message, 'err'); }
  };
  $('#mem-clear').onclick = async () => {
    if (!confirm('清空这个群的长期记忆？')) return;
    try { await action('memory.clear', { room: room() }); load(); toast('已清空', 'ok'); }
    catch (e) { toast('清空失败：' + e.message, 'err'); }
  };
  load();
}

/* ── 群成员 ───────────────────────────────────────── */
async function renderMembersExtra() {
  const S = App.S;
  const host = document.createElement('div');
  host.className = 'section';
  host.innerHTML = `<div class="hd">👥 群成员</div><div class="card">
    <div class="row"><select id="mb-room">${(S.rooms || []).map(r => `<option value="${esc(r.roomId)}">${esc(r.roomName || r.roomId)}</option>`).join('') || '<option value="">（还没有群）</option>'}</select>
      <button class="btn" id="mb-load">拉成员</button>
      <button class="btn primary" id="mb-save" disabled>保存昵称</button>
      <span class="muted small" id="mb-hint"></span></div>
    <div class="muted small" style="margin-top:6px">改完名字点「保存昵称」；保存后会写进 names.json，重载/重启都不丢。</div>
    <div id="mb-list" style="margin-top:10px"></div></div>`;
  view.appendChild(host);
  const saveBtn = $('#mb-save');
  const markDirty = (dirty) => {
    if (saveBtn) saveBtn.disabled = !dirty;
    App.memberDirty = !!dirty; // 让切页时能单独提示"昵称没保存"，且不影响参数页
    const hint = $('#mb-hint');
    if (hint && dirty) hint.textContent = '● 有未保存的昵称修改';
  };
  // 渲染成员列表；list 里的 name 是"当前编辑值"，切页回来还能接着改
  const renderList = (list) => {
    const hint = $('#mb-hint'), box = $('#mb-list');
    if (!hint || !box) return;
    hint.textContent = list.length + ' 人';
    box.innerHTML = list.map(m => `<div class="row" style="padding:4px 0;border-bottom:1px dashed var(--line)">
      <span class="mono small" style="width:120px">${esc(m.uid)}</span>
      <input type="text" data-uid="${esc(m.uid)}" value="${esc(m.name)}" style="flex:1;min-width:160px">
      <span class="muted small">${esc(m.role || '')}</span></div>`).join('');
    const refreshDirty = () => {
      let dirty = false;
      $$('#mb-list input[data-uid]').forEach(el => {
        const uid = el.dataset.uid;
        const orig = (App.memberOrig || {})[uid];
        const cur = String(el.value);
        // 同步回列表缓存，切页后不丢
        const item = (App.memberList && App.memberList.list || []).find(x => String(x.uid) === uid);
        if (item) item.name = cur;
        if (cur !== String(orig == null ? '' : orig)) dirty = true;
      });
      markDirty(dirty);
    };
    $$('#mb-list input[data-uid]').forEach(el => { el.oninput = refreshDirty; });
    refreshDirty();
  };
  $('#mb-load').onclick = async () => {
    const room = ($('#mb-room') || {}).value;
    if (!room) return;
    $('#mb-hint').textContent = '拉取中…';
    try {
      const list = await action('members', { room });
      App.members = list;
      App.memberOrig = {};
      for (const m of list) App.memberOrig[String(m.uid)] = String(m.name);
      App.memberList = { room, list: list.map(m => ({ uid: m.uid, name: m.name, role: m.role })) };
      renderList(App.memberList.list);
    } catch (e) { $('#mb-hint').textContent = '失败：' + e.message; }
  };
  // 从别的页面切回来：直接把上次拉的列表（含未保存的改名）画出来，不用重新拉
  if (App.memberList && App.memberList.room) {
    const sel = $('#mb-room');
    const hasOpt = sel && Array.from(sel.options || []).some(o => o.value === App.memberList.room);
    if (hasOpt) {
      sel.value = App.memberList.room;
      if (!App.memberOrig) App.memberOrig = {};
      renderList(App.memberList.list);
    }
  }
  if (saveBtn) saveBtn.onclick = async () => {
    const room = ($('#mb-room') || {}).value;
    if (!room) return;
    const list = [];
    $$('#mb-list input[data-uid]').forEach(el => {
      const uid = el.dataset.uid;
      const name = String(el.value).trim();
      const orig = (App.memberOrig || {})[uid];
      if (name !== String(orig == null ? '' : orig)) list.push({ uid, name });
    });
    if (!list.length) { toast('没有改动，不用保存', 'ok'); markDirty(false); return; }
    saveBtn.disabled = true;
    try {
      const r = await action('names.save', { room, list });
      App.memberOrig = App.memberOrig || {};
      for (const x of list) App.memberOrig[x.uid] = x.name;
      toast(`已保存 ${r.count} 个昵称（已落盘）`, 'ok');
      const hint = $('#mb-hint');
      if (hint) hint.textContent = '已保存 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
      markDirty(false);
    } catch (e) {
      toast('保存失败：' + e.message, 'err');
      saveBtn.disabled = false;
    }
  };
}

async function renderDiag() {

    <div class="row"><button class="btn primary" id="btn-check2">跑一遍自检</button>

function healthHtml(h) {
  if (!h || !h.items || !h.items.length) return '<div class="empty">还没检查过。</div>';

  return h.items.map(it => `<div style="padding:6px 0;border-bottom:1px dashed var(--line)">
    <b>${icon(it.level)} ${esc(it.name)}</b> <span class="muted">${esc(it.text)}</span>
    ${it.advice ? '<div class="small" style="margin-top:2px">建议：' + esc(it.advice) + '</div>' : ''}</div>`).join('');
}

  $('#ob-load').onclick = async () => {
    try {
      const r = await action('outbox');
      const hint = $('#ob-hint'); if (!hint) return;
      hint.textContent = r.count ? `${r.count} 条待重发：` + r.items.map(i => i.preview).join(' / ').slice(0, 120) : '重发队列为空';
    } catch (e) { const hint = $('#ob-hint'); if (hint) hint.textContent = '读取失败：' + e.message; }
  };
  $('#ob-flush').onclick = async () => {
    try {
      const r = await action('flushOutbox');
      const hint = $('#ob-hint'); if (hint) hint.textContent = r.count ? `还剩 ${r.count} 条没发出去` : '已全部重发或清空';
    } catch (e) { const hint = $('#ob-hint'); if (hint) hint.textContent = '重发失败：' + e.message; }
  };
  $('#cfg-reread').onclick = async () => {
    try {
      const r = await action('rereadConfig');
      const hint = $('#ob-hint'); if (hint) hint.textContent = r.changed.length ? '已重读，变化：' + r.changed.join(',') : '已重读，无变化';
      toast('配置已重读', 'ok');
      refresh();
    } catch (e) { toast('重读失败：' + e.message, 'err'); }
  };
  let timer = null;
  $('#log-auto').onchange = (e) => {
    App.logAuto = e.target.checked;
    localStorage.setItem('qb:logAuto', e.target.checked ? '1' : '0');
    if (timer) { clearInterval(timer); timer = null; }
    if (e.target.checked) { load(); timer = setInterval(load, 3000); App.timers.push(timer); }
  };
  if (App.logAuto) { load(); timer = setInterval(load, 3000); App.timers.push(timer); }
  $('#cfg-export').onclick = async () => {
    const j = await api('/export');
    const blob = new Blob([JSON.stringify(j.config, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'qq-bot-config.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $('#cfg-import').onclick = () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json';
    inp.onchange = async () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      try {
        const cfg = JSON.parse(await f.text());
        await api('/import', { method: 'POST', body: JSON.stringify({ config: cfg, confirm: 'import' }) });
        toast('已导入', 'ok'); refresh();
      } catch (e) { toast('导入失败：' + e.message, 'err'); }
    };
    inp.click();
  };
  load();
}

/* ── 每群性格 ─────────────────────────────────────── */
const roomCfgState = { room: '', data: null };

function roomInput(k, m, value, overridden) {
  const dis = overridden ? '' : 'disabled';
  if (m.type === 'bool') {
    return `<label class="sw"><input type="checkbox" data-rk="${k}" ${value ? 'checked' : ''} ${dis}><i></i></label>`;
  }
  if (m.type === 'number') {
    return `<input class="num" type="number" data-rk="${k}" value="${Number(value) || 0}"
      ${m.min != null ? `min="${m.min}"` : ''} ${m.max != null ? `max="${m.max}"` : ''} ${m.step != null ? `step="${m.step}"` : ''} ${dis}>`;
  }
  if (m.type === 'csv') {
    const v = Array.isArray(value) ? value.join(', ') : String(value || '');
    return `<input type="text" style="flex:1;min-width:200px" data-rk="${k}" value="${esc(v)}" ${dis}>`;
  }
  if (m.type === 'textarea') {
    return `<textarea data-rk="${k}" style="min-height:78px" ${dis}>${esc(value || '')}</textarea>`;
  }
  return `<input type="text" style="flex:1;min-width:200px" data-rk="${k}" value="${esc(value == null ? '' : value)}" ${dis}>`;
}

async function renderRoomCfg() {
  const S = App.S;
  const rooms = (S.rooms || []).filter(r => r.isGroup !== false).slice();
  for (const g of S.allowGroups || []) {
    if (!rooms.some(r => r.roomId === g)) rooms.push({ roomId: g, roomName: '', allowed: true, msgs: 0, overrideCount: 0 });
  }
  if (!rooms.length) {
    view.innerHTML = `<h2>🎭 每群性格</h2><div class="card"><div class="empty">还没有群。等群里来条消息，或先在「群与人」里配白名单。</div></div>`;
    return;
  }
  const pick = (roomCfgState.room && rooms.some(r => r.roomId === roomCfgState.room)) ? roomCfgState.room : rooms[0].roomId;
  roomCfgState.room = pick;

  view.innerHTML = `<h2>🎭 每群性格 <span class="muted small">改哪个群就选哪个群；没动过的项自动跟随全局</span></h2>
    <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
      <div class="card" style="flex:0 0 220px" id="rc-list"></div>
      <div class="card" style="flex:1 1 460px;min-width:340px" id="rc-edit">读取中…</div>
    </div>`;

  const paintList = () => {
    const box = $('#rc-list'); if (!box) return;
    box.innerHTML = rooms.map(r => {
      const n = r.overrideCount || 0;
      const on = r.roomId === pick;
      return `<div class="rc-row ${on ? 'on' : ''}" data-room="${esc(r.roomId)}">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.roomName || r.roomId)}</span>
        <span class="small muted">${n ? n + ' 项' : '跟随全局'}</span></div>`;
    }).join('');
    $$('#rc-list .rc-row').forEach(el => el.onclick = () => { roomCfgState.room = el.dataset.room; renderRoomCfg(); });
  };
  paintList();

  await loadRoomCfg(pick);
}

const RC_SECTIONS = [
  ['人设与称呼', ['persona', 'masterName', 'aliases']],
  ['回复节奏', ['replyProbability', 'alwaysReply', 'minReplyGapMs', 'maxRepliesPer10Min', 'debounceMs', 'cannedChance', 'repeatWindowMs', 'quietHours', 'quietAllowAt']],
  ['说话方式', ['delayScale', 'splitChance', 'maxLines', 'maxReplyChars', 'allowAt', 'atMentionChance', 'lengthSpread', 'moodEnabled', 'humanize', 'humanizeDropPeriod', 'pokeOnMe', 'pokeBack', 'pokeChance', 'pokeOnReply']],
  ['表情 / 识图 / 联网 / 视频', ['stickerChance', 'visionOnImage', 'visionOnEmoticon', 'webSearch', 'videoOnMessage', 'linkVideo', 'videoRemember']],
  ['更多玩法', ['games', 'polls', 'reminders', 'linkSummary', 'docOnFile', 'bondEnabled', 'diaryEnabled']],
  ['主动找人', ['proactive', 'proactiveIdleMs', 'proactiveMinGapMs', 'proactiveChance', 'proactiveHours']],
  ['记忆', ['contextMessages', 'historyLookup', 'historyLimit', 'memoryExtract', 'memoryExtractEvery', 'factsLimit', 'profileEvery']],
];

async function loadRoomCfg(room) {
  const box = $('#rc-edit');
  if (!box) return;
  let d;
  try {
    d = await api('/room-config?room=' + encodeURIComponent(room));
  } catch (e) {
    box.textContent = '读取失败：' + e.message;
    return;
  }
  const meta = App.S.meta || {};
  const keys = d.keys || [];
  const ovSet = new Set(Object.keys(d.override || {}));
  const keySet = new Set(keys);

  const showVal = (v) => {
    if (Array.isArray(v)) return v.join(', ') || '（空）';
    if (typeof v === 'boolean') return v ? '开' : '关';
    const s = String(v == null ? '' : v);
    return s.length > 18 ? s.slice(0, 18) + '…' : (s || '（空）');
  };

  // 按分组切 section，未归类的丢进「其他」
  const used = new Set();
  const sections = RC_SECTIONS.map(([title, list]) => {
    const ks = list.filter(k => keySet.has(k));
    ks.forEach(k => used.add(k));
    return [title, ks];
  }).filter(([, ks]) => ks.length);
  const rest = keys.filter(k => !used.has(k));
  if (rest.length) sections.push(['其他', rest]);

  const fieldHtml = (k) => {
    const m = meta[k] || { label: k, type: 'text' };
    const on = ovSet.has(k);
    const val = on ? d.override[k] : d.global[k];
    return `<div class="field rc-field" data-kk="${k}" data-on="${on ? 1 : 0}">
      <div class="lab">
        <span>${esc(m.label || k)}</span>
        <span class="small muted" data-inh>${on ? '自定义' : '继承 ' + esc(showVal(d.global[k]))}</span>
        <button class="btn ghost" data-revert="${k}" title="改回跟随全局" style="padding:1px 8px;font-size:11px;${on ? '' : 'display:none'}">改回继承</button>
      </div>
      <div class="ctl">${roomInput(k, m, val, true, true)}</div>
      ${m.help ? `<div class="help">${esc(m.help)}</div>` : ''}
    </div>`;
  };

  box.innerHTML = `
    <div class="rc-hd">
      <div class="row">
        <b style="font-size:15px">${esc(d.roomName || d.room)}</b>
        <span class="muted small" id="rc-count">${ovSet.size ? '自定义 ' + ovSet.size + ' 项' : '全部跟随全局'}</span>
        <span style="flex:1"></span>
        <label class="hswitch" title="只看本群单独设置过的项"><span class="sw"><input type="checkbox" id="rc-onlyov"><i></i></span>只看自定义</label>
        <button class="btn" id="rc-reset">全部改回继承</button>
        <button class="btn primary" id="rc-save">保存本群</button>
      </div>
      <div class="muted small" style="margin-top:4px">动哪个输入框，那一项就自动变成"本群自定义"；想恢复就点旁边的「改回继承」。</div>
    </div>
    <div id="rc-body">${sections.map(([title, ks]) => `<details class="rc-sec" data-sec="${esc(title)}" ${ks.some(k => ovSet.has(k)) || title === '人设与称呼' ? 'open' : ''}>
        <summary>${esc(title)}<span class="muted small" data-seccount>${ks.some(k => ovSet.has(k)) ? '（' + ks.filter(k => ovSet.has(k)).length + ' 项自定义）' : ''}</span></summary>
        ${ks.map(fieldHtml).join('')}
      </details>`).join('')}</div>`;

  const setCount = () => {
    const el = $('#rc-count');
    if (el) el.textContent = ovSet.size ? '自定义 ' + ovSet.size + ' 项' : '全部跟随全局';
    $$('.rc-sec').forEach(sec => {
      const ks = (RC_SECTIONS.find(([t]) => t === sec.dataset.sec) || [null, []])[1].filter(k => keySet.has(k));
      const n = ks.filter(k => ovSet.has(k)).length;
      const tag = sec.querySelector('[data-seccount]');
      if (tag) tag.textContent = n ? '（' + n + ' 项自定义）' : '';
    });
  };

  const mark = (k, on) => {
    const row = box.querySelector(`[data-kk="${k}"]`);
    if (!row) return;
    if (on) ovSet.add(k); else ovSet.delete(k);
    row.dataset.on = on ? '1' : '0';
    const inh = row.querySelector('[data-inh]');
    const rv = row.querySelector('[data-revert]');
    const m = meta[k] || {};
    if (inh) inh.textContent = on ? '自定义' : '继承 ' + showVal(d.global[k]);
    if (rv) rv.style.display = on ? '' : 'none';
    applyFilter();
    setCount();
  };

  // 输入即视为自定义，不用先勾开关
  keys.forEach(k => {
    const row = box.querySelector(`[data-kk="${k}"]`);
    const inp = row && row.querySelector('[data-rk]');
    if (!inp) return;
    const m = meta[k] || {};
    inp.disabled = false;
    const evt = m.type === 'bool' ? 'change' : 'input';
    inp.addEventListener(evt, () => mark(k, true));
  });

  box.querySelectorAll('[data-revert]').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.revert;
      const row = box.querySelector(`[data-kk="${k}"]`);
      const inp = row && row.querySelector('[data-rk]');
      const m = meta[k] || {};
      if (inp) {
        if (m.type === 'bool') inp.checked = !!d.global[k];
        else if (m.type === 'csv') inp.value = Array.isArray(d.global[k]) ? d.global[k].join(', ') : String(d.global[k] || '');
        else inp.value = d.global[k] == null ? '' : d.global[k];
      }
      mark(k, false);
    };
  });

  const applyFilter = () => {
    const only = $('#rc-onlyov') && $('#rc-onlyov').checked;
    $$('.rc-field').forEach(el => {
      const on = el.dataset.on === '1';
      el.style.display = only && !on ? 'none' : '';
    });
    if (only) $$('.rc-sec').forEach(s => { s.open = true; });
  };
  const onlyBox = $('#rc-onlyov');
  if (onlyBox) onlyBox.onchange = applyFilter;

  $('#rc-save').onclick = async () => {
    const overrides = {};
    for (const k of ovSet) {
      const row = box.querySelector(`[data-kk="${k}"]`);
      const inp = row && row.querySelector('[data-rk]');
      if (!inp) continue;
      const m = meta[k] || {};
      if (m.type === 'bool') overrides[k] = inp.checked;
      else if (m.type === 'number') overrides[k] = Number(inp.value);
      else if (m.type === 'csv') overrides[k] = inp.value.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean);
      else overrides[k] = inp.value;
    }
    try {
      const r = await api('/room-config', { method: 'POST', body: JSON.stringify({ room: d.room, overrides }) });
      toast(`已保存：本群自定义 ${r.count} 项` + (r.ok ? '' : '（有被拒项）'), r.ok ? 'ok' : 'err');
      // 只更新左侧计数，不整页重渲染（避免滚动跳走）
      const row = document.querySelector(`#rc-list .rc-row[data-room="${d.room}"] .muted`);
      if (row) row.textContent = r.count ? r.count + ' 项' : '跟随全局';
      setCount();
    } catch (e) { toast('保存失败：' + e.message, 'err'); }
  };

  $('#rc-reset').onclick = async () => {
    if (!confirm('把这个群恢复成完全跟随全局？')) return;
    try {
      await api('/room-config', { method: 'POST', body: JSON.stringify({ room: d.room, reset: true }) });
      toast('已恢复跟随全局', 'ok');
      const row = document.querySelector(`#rc-list .rc-row[data-room="${d.room}"] .muted`);
      if (row) row.textContent = '跟随全局';
      await loadRoomCfg(d.room);
    } catch (e) { toast('失败：' + e.message, 'err'); }
  };
}

/* ── 手动操作 ─────────────────────────────────────── */
function renderManual() {
  const S = App.S;
  // 私聊会话不能当群发（服务端会拒），这里只列已授权的群
  const rooms = (S.rooms || []).filter(r => r.isGroup !== false && r.allowed !== false);
  view.innerHTML = `<h2>手动操作</h2>
    <div class="section"><div class="hd">🕹 直接发 / 让它回 / 回放自测</div><div class="card">
      <div class="row"><select id="m-room">${rooms.map(r => `<option value="${esc(r.roomId)}">${esc(r.roomName || r.roomId)}</option>`).join('') || '<option value="">（还没有群）</option>'}</select>
        <button class="btn" id="m-reconnect">重连 SnowLuma</button></div>
      <div class="row" style="margin-top:10px"><input type="text" id="m-say" style="flex:1;min-width:240px" placeholder="直接以机器人身份发送（不走模型）">
        <button class="btn" id="m-say-btn">发送</button></div>
      <div class="row" style="margin-top:10px"><input type="text" id="m-ask" style="flex:1;min-width:240px" placeholder="让它生成一句并发送（测延迟）">
        <button class="btn primary" id="m-ask-btn">生成并发送</button></div>
      <div class="row" style="margin-top:10px"><button class="btn" id="m-selftest">回放最近一条别人的消息（会真的回复）</button>
        <span class="muted small" id="m-hint"></span></div>
    </div></div>`;
  const room = () => ($('#m-room') || {}).value;
  const hint = (t) => { const el = $('#m-hint'); if (el) el.textContent = t; };
  // 包一层：运行期间禁用按钮，避免手快点两次发两条
  const busy = async (btn, fn) => {
    const b = btn ? $(btn) : null;
    if (b) { b.disabled = true; }
    try { return await fn(); } finally { if (b) b.disabled = false; }
  };
  $('#m-reconnect').onclick = async (e) => {
    try { await busy(null, () => action('reconnect')); toast('已重连', 'ok'); refresh(); }
    catch (err) { toast('重连失败：' + err.message, 'err'); }
  };
  $('#m-say-btn').onclick = async () => {
    const text = $('#m-say').value.trim(); if (!text) return;
    try {
      await busy('#m-say-btn', () => action('say', { room: room(), text }));
      $('#m-say').value = ''; toast('已发送', 'ok'); refresh({ lite: true });
    } catch (e) { toast('失败：' + e.message, 'err'); }
  };
  $('#m-ask-btn').onclick = async () => {
    const prompt = $('#m-ask').value.trim();
    hint('生成中…');
    try {
      const r = await busy('#m-ask-btn', () => action('ask', { room: room(), prompt }));
      hint(`首字 ${r.firstTokenMs}ms · 总 ${r.totalMs}ms · ${(r.sent || []).join(' / ')}`);
      const box = $('#m-ask'); if (box) box.value = '';
      refresh({ lite: true });
    } catch (e) { hint('失败：' + e.message); }
  };
  $('#m-selftest').onclick = async () => {
    hint('回放中…');
    try {
      const j = await busy('#m-selftest', () => api('/action', { method: 'POST', body: JSON.stringify({ op: 'selftest', args: { room: room() } }) }));
      hint('完成：' + JSON.stringify(j.result || {}));
      refresh({ lite: true });
    } catch (e) { hint('失败：' + e.message); }
  };
}

/* ── 启动 ─────────────────────────────────────────── */
/* 头部「刷新」：重载插件（应用磁盘上的代码/配置改动），随后刷新页面拿新客户端包 */
$('#h-refresh').onclick = async () => {
  if (!leaveGuard()) return;
  if (!confirm('重载插件？会用磁盘上的最新代码与配置重启机器人，连接会中断约 2 秒。')) return;
  try {
    await action('reloadPlugin');
    toast('正在重载…页面会在 4 秒后自动刷新', 'ok');
    setTimeout(() => { location.reload(); }, 4000);
  } catch (e) { toast('重载失败：' + e.message, 'err'); }
};

$('#m-enabled').onchange = async (e) => {
  if (!leaveGuard()) { e.target.checked = !e.target.checked; return; }
  try { await api('/config', { method: 'POST', body: JSON.stringify({ patch: { enabled: e.target.checked } }) }); toast(e.target.checked ? '已开启自动回复' : '已关闭自动回复', 'ok'); refresh(); }
  catch (err) { e.target.checked = !e.target.checked; toast('失败：' + err.message, 'err'); }
};
$('#m-dry').onchange = async (e) => {
  if (!leaveGuard()) { e.target.checked = !e.target.checked; return; }
  try { await api('/config', { method: 'POST', body: JSON.stringify({ patch: { dryRun: e.target.checked } }) }); toast(e.target.checked ? '演练模式' : '正常发送', 'ok'); refresh(); }
  catch (err) { e.target.checked = !e.target.checked; toast('失败：' + err.message, 'err'); }
};

renderNav();
refresh();
(window.__qqpanelTimers = window.__qqpanelTimers || []).push(
  // 页面在后台（切走标签页/最小化）时不刷新；切回来立刻补一次
  setInterval(() => { if (!document.hidden && App.tab === 'overview') refresh({ lite: true }); }, 5000),
);
if (!window.__qqpanelVisBound) {
  window.__qqpanelVisBound = true;
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && App.tab === 'overview') refresh({ lite: true });
  });
}
</script>
