   ════════════════════════════════════════════════════════════════════ */

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(2, '0');
const fmtTime = (ts) => { if (!ts) return '—'; const d = new Date(ts); return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); };
const fmtDay = (ts) => { if (!ts) return '—'; const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fmtHM = (ts) => { if (!ts) return ''; const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const ago = (ts) => { if (!ts) return '—'; const s = Math.round((Date.now()-ts)/1000); if (s<60) return s+' 秒前'; if (s<3600) return Math.round(s/60)+' 分钟前'; if (s<86400) return Math.round(s/3600)+' 小时前'; return Math.round(s/86400)+' 天前'; };
const fmtMs = (v) => { const n = Number(v)||0; if (n >= 3600000) return (n/3600000).toFixed(n%3600000?1:0)+' 小时'; if (n >= 60000) return (n/60000).toFixed(n%60000?1:0)+' 分钟'; if (n >= 1000) return (n/1000).toFixed(n%1000?1:0)+' 秒'; return n+' ms'; };
const pct = (v) => Math.round((Number(v)||0)*100)+'%';
const fmtTokens = (v) => { const n = Number(v)||0; if (n>=1e6) return (n/1e6).toFixed(2)+'M'; if (n>=1e3) return (n/1e3).toFixed(1)+'K'; return String(n); };
function fmtBytes(n) {
  const b = Number(n) || 0;
  if (b >= 1024 * 1024 * 1024) return (Math.round((b / 1024 / 1024 / 1024) * 100) / 100) + ' GB';
  if (b >= 1024 * 1024) return (Math.round((b / 1024 / 1024) * 100) / 100) + ' MB';
  if (b >= 1024) return (Math.round((b / 1024) * 100) / 100) + ' KB';
  return b + ' 字节';
}

/* 极简 Markdown 渲染：只支持标题/列表/加粗/行内代码 —— 画像、摘要、关系都是这种结构 */
function mdToHtml(src) {
  const lines = esc(src || '').split(/\r?\n/);
  let html = '', inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }
    let m;
    if ((m = /^#{3,}\s+(.*)$/.exec(line))) { closeList(); html += `<h5>${m[1]}</h5>`; continue; }
    if ((m = /^##\s+(.*)$/.exec(line))) { closeList(); html += `<h4>${m[1]}</h4>`; continue; }
    if ((m = /^#\s+(.*)$/.exec(line))) { closeList(); html += `<h4>${m[1]}</h4>`; continue; }
    if ((m = /^[-*]\s+(.*)$/.exec(line))) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${m[1]}</li>`;
      continue;
    }
    closeList();
    html += `<p>${line}</p>`;
  }
  closeList();
  return html
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

const API_BASE = '/qq-bot/api';
async function api(path, opts) {
  const r = await fetch(API_BASE + path, Object.assign({ credentials: 'same-origin' }, opts, {
    headers: Object.assign({ 'content-type': 'application/json' }, (opts && opts.headers) || {}),
  }));
  const text = await r.text();
  let j; try { j = JSON.parse(text); } catch { throw new Error('响应不是 JSON（HTTP ' + r.status + '）'); }
  if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
async function action(op, args) {
  const j = await api('/action', { method: 'POST', body: JSON.stringify({ op, args: args || {} }) });
  return j.result;
}
// 运行期间禁用按钮，避免手快点两次；btn 可以是选择器字符串或元素本身
async function busy(btn, fn) {
  const b = !btn ? null : typeof btn === 'string' ? $(btn) : btn;
  if (b) b.disabled = true;
  try { return await fn(); } finally { if (b) b.disabled = false; }
}
let toastTimer = null;
function toast(msg, kind) {
  const el = $('#toast'); if (!el) return;
  el.textContent = msg;
  el.className = 'toast show ' + (kind || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, kind === 'err' ? 4200 : 2400);
}

   颜色走 --wh-* 变量（深色主题自动调深）；系统开了"减少动画"就不动 */

let whaleSeq = 0;
function whale(mood, size, cls) {
  const m = mood || 'calm';
  const id = 'qqwh' + (++whaleSeq);
  const w = typeof size === 'number' ? size + 'px' : (size || '48px');
  const eye = m === 'happy' ? '<path class="wl" d="M32 53q4-6 8 0"/>'
    : m === 'sleep' ? '<path class="wl" d="M32 51q4 4 8 0"/>'
    : m === 'dizzy' ? '<path class="wl thin" d="M31.4 52a4.6 4.6 0 1 1 4.6 4.6a3 3 0 1 1 3-3a1.4 1.4 0 1 1-1.4 1.4"/>'
    : '<ellipse class="we" cx="36" cy="52" rx="3.6" ry="4.4"/><circle class="wg" cx="37.4" cy="50.2" r="1.4"/>';
  const mouth = m === 'happy' ? '<path class="wm" d="M20.5 60.5q5.5 8 11 0q-5.5 2-11 0z"/>'
    : m === 'dizzy' ? '<ellipse class="wm" cx="25.5" cy="63" rx="2.2" ry="2.6"/>'
    : m === 'sleep' ? '<path class="wl" d="M22 63.5q3 1.5 6 0"/>'
    : '<path class="wl" d="M21 61.5q4 4 8 0"/>';
  const extra = m === 'sleep' ? '<text class="wz z1" x="60" y="22">z</text><text class="wz z2" x="70" y="13">z</text>'
    : m === 'dizzy' ? '<path class="wst s1" d="M27 14l1.6 3.4 3.4 1.6-3.4 1.6-1.6 3.4-1.6-3.4-3.4-1.6 3.4-1.6z"/><path class="wst s2" d="M48 8l1.1 2.4 2.4 1.1-2.4 1.1-1.1 2.4-1.1-2.4-2.4-1.1 2.4-1.1z"/>'
    : (m === 'swim' || m === 'peek') ? '<circle class="wbb b1" cx="8" cy="48" r="3"/><circle class="wbb b2" cx="5" cy="36" r="2.2"/><circle class="wbb b3" cx="10" cy="26" r="1.6"/>'
    : '<g class="wsp"><path d="M53 24c0-6-3-10-8-12M53 24c0-6 3-10 8-12M53 24V11"/><circle cx="44" cy="9" r="1.8"/><circle cx="62" cy="9" r="1.8"/></g>';
  const water = m === 'peek' ? '<path class="wwa" d="M0 82q7.75-6 15.5 0t15.5 0 15.5 0 15.5 0 15.5 0 15.5 0 15.5 0 15.5 0V100H0z"/>' : '';
  return `<svg class="wh ${m}${cls ? ' ' + cls : ''}" viewBox="0 0 124 100" style="width:${w}" aria-hidden="true">` +
    `<defs><clipPath id="${id}"><path d="${WH_BODY}"/></clipPath></defs><g class="wfloat">` +
    `<path class="wt" d="${WH_TAIL}"/><path class="wb" d="${WH_BODY}"/>` +
    `<ellipse class="wbel" cx="52" cy="90" rx="46" ry="16" clip-path="url(#${id})"/>` +
    `<path class="wfin" d="M58 76c2 9 9 13 15 11-4-3-7-7-8-12z"/><path class="whl" d="M30 39c6-6 15-9 24-9"/>` +
    `${eye}<ellipse class="wc" cx="45" cy="61" rx="4.6" ry="2.8"/>${mouth}${extra}</g>${water}</svg>`;
}

const ICON_SEL = '.bub, .ic, .fcard .ico, .todo .ti, .note .ni, .note > span, .lrow .lead, .lrow .meta, .lrow .meta > span, .chip, .btn, .tab, h3, h4, .card-hd, summary, ' +

const EMOJI_SPLIT = /(\p{Extended_Pictographic}\uFE0F?)/u;
function iconizeEl(el) {
  for (const n of Array.from(el.childNodes)) {
    if (n.nodeType !== 3 || !n.nodeValue || !EMOJI_SPLIT.test(n.nodeValue)) continue;
    const parts = n.nodeValue.split(EMOJI_SPLIT);
    if (!parts.some(p => EMO2IC[p.replace('\uFE0F', '')])) continue;
    const frag = document.createDocumentFragment();
    for (const p of parts) {
      if (!p) continue;
      const name = EMO2IC[p.replace('\uFE0F', '')];
      if (!name) { frag.appendChild(document.createTextNode(p)); continue; }
      const t = document.createElement('template');
      t.innerHTML = name === 'whale' ? whale('calm', '1.45em', 'inline') : ic(name);

/** 头像颜色：同一个人每次都是同一种颜色 */
function avColor(key) {
  let h = 0;
  for (const ch of String(key || '')) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return AV_COLORS[h % AV_COLORS.length];
}
/** 圆形头像（名字第一个字，颜色按人固定） */
const avatar = (name, key, size) => `<span class="avt" style="--c:${avColor(key || name)};${size ? `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.42)}px` : ''}">${esc(String(name || '?').slice(0, 1))}</span>`;

/* ── 深浅主题：看实际的卡片底色亮不亮（DSH 的主题、系统的浅色 / 深色都能认出来） ── */
function detectTone() {
  const root = $('#qq-panel'); if (!root) return;
  const probe = document.createElement('i');
  probe.style.cssText = 'position:absolute;width:0;height:0;background:var(--card)';
  root.appendChild(probe);
  const c = getComputedStyle(probe).backgroundColor;
  probe.remove();
  try {
    const cv = document.createElement('canvas'); cv.width = cv.height = 1;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillStyle = c; ctx.fillRect(0, 0, 1, 1);
    const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
    const tone = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 < 0.45 ? 'dark' : 'light';
    if (root.dataset.tone !== tone) root.dataset.tone = tone;
  } catch { /* 读不出来就按浅色 */ }
}

/* ── 悬停气泡（图表用）：data-tip="第一行\n第二行"；有 [data-anchor] 时对准它 ── */
function bindTips() {
  const root = $('#qq-panel'); if (!root) return;
  let tip = null, cur = null;
  const hide = () => { if (tip) tip.classList.remove('show'); cur = null; };
  root.addEventListener('mouseover', (e) => {
    const el = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!el) { if (cur) hide(); return; }
    if (el === cur) return;
    cur = el;
    if (!tip) { tip = document.createElement('div'); tip.className = 'qtip'; root.appendChild(tip); }
    tip.textContent = el.getAttribute('data-tip');
    const pr = root.getBoundingClientRect();
    const r = (el.querySelector('[data-anchor]') || el).getBoundingClientRect();
    tip.classList.add('show');
    const tw = tip.offsetWidth;
    const x = Math.max(tw / 2 + 8, Math.min(pr.width - tw / 2 - 8, r.left + r.width / 2 - pr.left));
    tip.style.left = x + 'px';
    tip.style.top = (r.top - pr.top - 10) + 'px';
  });
  root.addEventListener('mouseleave', hide);
  root.addEventListener('scroll', hide, true);
}

/** 平滑曲线（Catmull-Rom → 三次贝塞尔），控制点不越过上下边 */
function smoothPath(pts, top, bottom) {
  if (!pts.length) return '';
  const f = (v) => v.toFixed(1);
  const cy = (v) => Math.max(top, Math.min(bottom, v));
  let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${f(p1[0] + (p2[0] - p0[0]) / 6)},${f(cy(p1[1] + (p2[1] - p0[1]) / 6))} ${f(p2[0] - (p3[0] - p1[0]) / 6)},${f(cy(p2[1] - (p3[1] - p1[1]) / 6))} ${f(p2[0])},${f(p2[1])}`;
  }
  return d;
}

/** 整页重画后，让某个元素留在屏幕上原来的位置：上面的内容异步加载、高度变了也跟着校正；用户一滚动 / 点击就停 */
function pinScroll(getEl, offset, ms) {
  const m = mainEl(); if (!m) return;
  const apply = () => {
    const el = getEl(); if (!el) return;
    const d = el.getBoundingClientRect().top - m.getBoundingClientRect().top - offset;
    if (Math.abs(d) > 1) m.scrollTo({ top: m.scrollTop + d, behavior: 'instant' });
  };
  apply();
  const ro = new ResizeObserver(apply);
  ro.observe(view);
  const EVENTS = ['wheel', 'pointerdown', 'keydown', 'touchstart'];
  const stop = () => { ro.disconnect(); EVENTS.forEach(t => m.removeEventListener(t, stop)); };
  EVENTS.forEach(t => m.addEventListener(t, stop, { passive: true }));
  setTimeout(stop, ms || 3000);
}

/** 保存成功：按钮变绿打个勾，1.5 秒后恢复 */
function flashSaved(btn, text) {
  if (!btn) return;
  if (!btn.dataset.label) btn.dataset.label = btn.innerHTML;
  btn.classList.add('saved');
  btn.innerHTML = ic('tick') + esc(text || '已保存');
  clearTimeout(btn._savedTimer);
  btn._savedTimer = setTimeout(() => {
    btn.classList.remove('saved');
    btn.innerHTML = btn.dataset.label;
    delete btn.dataset.label;
  }, 1500);
}

/* ── 抽屉（右侧滑出）：同一时间只开一个 ── */
let openDrawer = null;
function drawer({ icon, title, sub, body, foot, onMount, onClose }) {
  closeDrawer();
  const root = $('#overlay-root'); if (!root) return null;
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const el = document.createElement('div'); el.className = 'drawer'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', title || '');
  el.innerHTML = `<div class="dh"><div class="bub">${icon || '📝'}</div><div class="grow"><b>${esc(title || '')}</b>${sub ? `<div class="muted">${sub}</div>` : ''}</div>
    <button class="btn ghost icon" data-x aria-label="关闭">✕</button></div><div class="db">${body || ''}</div>${foot ? `<div class="df">${foot}</div>` : ''}`;
  root.append(scrim, el);
  const handle = { el, close: () => {} };
  handle.close = () => { scrim.remove(); el.remove(); if (openDrawer === handle) openDrawer = null; if (onClose) onClose(); };
  scrim.onclick = handle.close;
  el.querySelector('[data-x]').onclick = handle.close;
  openDrawer = handle;
  if (onMount) onMount(el, handle.close);
  setTimeout(() => { const f = el.querySelector('.db input, .db textarea, .db select') || el.querySelector('[data-x]'); if (f) f.focus({ preventScroll: true }); }, 30);
  return handle;
}
function closeDrawer() { if (openDrawer) openDrawer.close(); }

/* ── 弹窗：代替浏览器自带的 confirm / prompt ── */
let openDialog = null;
function dialog({ icon, title, text, okText, cancelText, danger, input }) {
  return new Promise((resolve) => {
    if (openDialog) openDialog.cancel();
    const root = $('#overlay-root'); if (!root) return resolve(input ? null : false);
    const scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.style.zIndex = '62';
    const el = document.createElement('div'); el.className = 'dialog' + (danger ? ' danger' : ''); el.style.zIndex = '63';
    el.setAttribute('role', 'alertdialog');
    el.innerHTML = `<div class="dt"><span class="bub">${icon || (danger ? '⚠️' : whale('calm', 28))}</span>${esc(title || '')}</div>${text ? `<div class="dx">${esc(text)}</div>` : ''}
      ${input ? `<input type="text" data-in value="${esc(input.value || '')}" placeholder="${esc(input.placeholder || '')}">` : ''}
      <div class="da"><button class="btn ghost" data-no>${esc(cancelText || '取消')}</button><button class="btn ${danger ? 'danger solid' : 'primary'}" data-ok>${esc(okText || '确定')}</button></div>`;
    root.append(scrim, el);
    const done = (v) => { scrim.remove(); el.remove(); openDialog = null; resolve(v); };
    const ok = () => done(input ? String(el.querySelector('[data-in]').value) : true);
    const cancel = () => done(input ? null : false);
    openDialog = { cancel };
    scrim.onclick = cancel;
    el.querySelector('[data-no]').onclick = cancel;
    el.querySelector('[data-ok]').onclick = ok;
    el.onkeydown = (e) => { if (e.key === 'Enter' && input) { e.preventDefault(); ok(); } };
    setTimeout(() => { const f = el.querySelector('[data-in]') || el.querySelector('[data-ok]'); if (f) { f.focus(); if (f.select) f.select(); } }, 30);
  });
}
const uiConfirm = (title, text, opts) => dialog(Object.assign({ title, text }, opts || {}));
const uiPrompt = (title, text, value, opts) => dialog(Object.assign({ title, text, input: { value, placeholder: (opts && opts.placeholder) || '' } }, opts || {}));
$('#qq-panel').addEventListener('keydown', (e) => {

/* 参数的可读值（"≈ 2.5 秒"），只有换个说法确实更好懂时才显示 */
function humanValue(k, v, m) {
  const n = Number(v);
  if (v == null || v === '' || !Number.isFinite(n)) return '';
  const abs = Math.abs(n);
  if (m && (m.unit === '毫秒' || /Ms$/.test(k) || m.scale)) {
    if (abs < 1000) return '';
    if (abs < 60000) return '≈ ' + (Math.round((n / 1000) * 10) / 10) + ' 秒';
    if (abs < 3600000) return '≈ ' + (Math.round((n / 60000) * 10) / 10) + ' 分钟';
    return '≈ ' + (Math.round((n / 3600000) * 10) / 10) + ' 小时';
  }
  if (m && m.unit === '秒') {
    if (abs < 60) return '';
    if (abs < 3600) return '≈ ' + (Math.round((n / 60) * 10) / 10) + ' 分钟';
    return '≈ ' + (Math.round((n / 3600) * 10) / 10) + ' 小时';
  }
  if (m && (m.unit === '字节' || /Bytes$/.test(k))) {
    if (abs < 1024) return '';
    return '≈ ' + fmtBytes(n);
  }
  if (m && m.unit === 'MB') return abs >= 1024 ? '≈ ' + (Math.round((n / 1024) * 10) / 10) + ' GB' : '';
  if (m && m.min === 0 && m.max === 1) return pct(n);
  if (abs >= 100000000) return '≈ ' + (n / 100000000).toFixed(1).replace(/\.0$/, '') + ' 亿';
  if (abs >= 10000) return '≈ ' + (n / 10000).toFixed(1).replace(/\.0$/, '') + ' 万';
  return '';
}

/* ── 搜设置项：页面名 + 179 个参数的名字 / 键名 / 说明 ── */
function searchIndex() {
  const meta = (App.S && App.S.meta) || {};
  const out = NAV.map(n => ({ kind: 'page', page: n.id, label: n.icon + ' ' + n.title, sub: '页面', text: n.title }));
  for (const [k, m] of Object.entries(meta)) {
    if (m.group === 'internal') continue;
    const page = NAV.find(n => (n.groups || []).includes(m.group));
    if (!page) continue;
    out.push({ kind: 'field', key: k, page: page.id, label: m.label || k, sub: page.icon + ' ' + page.title + (m.advanced ? ' · 高级参数' : ''), text: [m.label, k, m.help].join(' ') });
  }
  return out;
}
function bindNavSearch() {
  const inp = $('#nav-q'), res = $('#nav-res');
  if (!inp || !res) return;
  let hits = [], sel = 0;
  const paint = () => {
    const q = inp.value.trim().toLowerCase();
    if (!q) { res.classList.remove('show'); res.innerHTML = ''; return; }
    const all = searchIndex();
    const score = (x) => (x.label.toLowerCase().includes(q) ? 0 : 1) + (x.kind === 'page' ? 0 : 0.5);
    hits = all.filter(x => x.text.toLowerCase().includes(q)).sort((a, b) => score(a) - score(b)).slice(0, 14);
    sel = 0;
    res.innerHTML = hits.length
      ? hits.map((h, i) => `<a href="#" data-hit="${i}" class="${i === sel ? 'on' : ''}">${esc(h.label)}<small>${esc(h.sub)}</small></a>`).join('')
      : '<div class="none">没找到「' + esc(inp.value.trim()) + '」相关的设置</div>';
    res.classList.add('show');
    $$('[data-hit]', res).forEach(a => a.onmousedown = (e) => { e.preventDefault(); pick(hits[Number(a.dataset.hit)]); });
  };
  const pick = (h) => {
    if (!h) return;
    inp.value = '';
    res.classList.remove('show');
    if (h.kind === 'page') { go(h.page); return; }
    const m = (App.S.meta || {})[h.key] || {};
    if (m.advanced && !App.showAdvanced) { App.showAdvanced = true; localStorage.setItem('qb:adv', '1'); }
    App.focusKey = h.key;
    go(h.page, { force: true }).then(ok => { if (!ok) App.focusKey = ''; });
  };
  inp.oninput = paint;
  inp.onfocus = paint;
  inp.onblur = () => setTimeout(() => res.classList.remove('show'), 120);
  inp.onkeydown = (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!hits.length) return;
      sel = (sel + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length;
      $$('[data-hit]', res).forEach((a, i) => a.classList.toggle('on', i === sel));
    } else if (e.key === 'Enter') { e.preventDefault(); pick(hits[sel]); }
    else if (e.key === 'Escape') { inp.value = ''; paint(); inp.blur(); }
  };
}
/** 跳到某个参数：展开它所在的折叠区、滚过去、闪一下 */
function focusField(key) {
  const el = view.querySelector(`[data-field="${key}"]`);

  let p = el.parentElement;

  el.scrollIntoView({ block: 'center', behavior: 'smooth' });

}

    if (!ok2) return false;

/** 总览页头：小鲸鱼 + 问候 + 一句话说现在怎么样；背景随早晚变 */
function heroHtml(S, h, todo) {
  const st = S.stats || {}, conn = S.connection || {};
  const hr = new Date().getHours();
  const greet = hr < 5 ? '夜深了' : hr < 9 ? '早上好' : hr < 11 ? '上午好' : hr < 13 ? '中午好' : hr < 18 ? '下午好' : hr < 23 ? '晚上好' : '夜深了';
  const period = hr >= 5 && hr < 11 ? 'morning' : hr >= 11 && hr < 17 ? 'day' : hr >= 17 && hr < 20 ? 'evening' : 'night';
  const quiet = quietNow(S.config.quietHours);
  let mood = 'happy', line;
  if (!conn.connected) { mood = 'dizzy'; line = '连不上 QQ 了，我有点晕……去「手动操作」点一下重连'; }
  else if (!S.config.enabled) { mood = 'sleep'; line = '我现在停用中：照常收消息、记上下文，但不说话'; }
  else if ((h.bad || []).length) { mood = 'dizzy'; line = `自检有 ${h.bad.length} 项异常，去「诊断」看看`; }
  else if (quiet) { mood = 'sleep'; line = `现在是安静时段（${quiet}），我只回 @`; }
  else if (S.config.dryRun) { mood = 'calm'; line = '演练模式：照常想回复，但不发出去'; }
  else line = `这次启动以来收到 ${st.msgsIn || 0} 条消息，回了 ${st.replies || 0} 句` + (todo.length ? `；有 ${todo.length} 件事等你处理` : '，一切正常');
  const who = String(S.config.masterName || '').trim();
  return `<div class="hero t-${period}"><div class="hw">${whale(mood, 92)}</div>
    <div class="grow"><div class="hi">${greet}${who ? '，' + esc(who) : ''}</div><div class="hs">${esc(line)}</div>
      <div class="hm tiny muted">${esc(ago(S.at))}更新 · 每 5 秒自动刷新</div></div>
    <div class="acts"><button class="btn" id="btn-refresh">刷新</button><button class="btn primary" id="btn-check">🩺 立即自检</button></div></div>`;
}
/** 安静时段：现在在哪一段里就返回那一段（"23:00-08:00"），不在就返回空 */
function quietNow(spec) {
  const now = new Date(), min = now.getHours() * 60 + now.getMinutes();
  for (const raw of String(spec || '').split(/[,，]/)) {
    const m = /^\s*(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})\s*$/.exec(raw);
    if (!m) continue;
    const a = (Number(m[1]) % 24) * 60 + Number(m[2]), b = (Number(m[3]) % 24) * 60 + Number(m[4]);
    if (a <= b ? (min >= a && min < b) : (min >= a || min < b)) return raw.trim();
  }
  return '';
}
/** 7 天用量柱状图：圆头柱子、今天高亮、悬停气泡看数 */
function usageChart(days) {
  const W = 520, H = 176, L = 42, R = 8, T = 22, B = 26, iw = W - L - R, ih = H - T - B, n = days.length, step = iw / n;
  const bw = Math.min(38, step * 0.56);
  const max = Math.max(1, ...days.map(d => d.total || 0));
  const grid = [0, 0.5, 1].map(f => { const y = T + ih - f * ih; return `<line class="gl" x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="ax" x="${L - 7}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${fmtTokens(Math.round(max * f))}</text>`; }).join('');
  const WK = ['日', '一', '二', '三', '四', '五', '六'];
  const bars = days.map((d, i) => {
    const v = d.total || 0, x = L + i * step + (step - bw) / 2, hgt = Math.max(4, (v / max) * ih), y = T + ih - hgt, r = Math.min(10, bw / 2, hgt);
    const today = i === n - 1;
    const dt = new Date(String(d.day) + 'T00:00:00');
    const tip = `${d.day}（周${WK[dt.getDay()] || ''}）\n${v.toLocaleString('zh-CN')} token · ${d.calls || 0} 次`;
    return `<g class="ubar${today ? ' today' : ''}" data-tip="${esc(tip)}"><rect class="hit" x="${(L + i * step).toFixed(1)}" y="${T}" width="${step.toFixed(1)}" height="${ih}"/>` +
      `<path class="bv" data-anchor d="M${x.toFixed(1)},${(T + ih).toFixed(1)}V${(y + r).toFixed(1)}Q${x.toFixed(1)},${y.toFixed(1)} ${(x + r).toFixed(1)},${y.toFixed(1)}H${(x + bw - r).toFixed(1)}Q${(x + bw).toFixed(1)},${y.toFixed(1)} ${(x + bw).toFixed(1)},${(y + r).toFixed(1)}V${(T + ih).toFixed(1)}Z"/>` +
      (today ? `<text class="uv" x="${(x + bw / 2).toFixed(1)}" y="${(y - 6).toFixed(1)}" text-anchor="middle">${fmtTokens(v)}</text>` : '') +
      `<text class="ax" x="${(x + bw / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle">${today ? '今天' : esc(String(d.day).slice(5))}</text></g>`;
  }).join('');
  return `<svg class="chart usage-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="最近 7 天 token 用量">
    <defs><linearGradient id="ug-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:.16"/></linearGradient></defs>${grid}${bars}</svg>`;
}
/** 一条聊天气泡 */
function msgHtml(m, withRoom) {
  const me = !!m.isSelf;

function normVal(k, v) {
  const m = META()[k] || {};

  if (m.type === 'csv') return (Array.isArray(v) ? v : String(v || '').split(/[,，\s]+/)).map(s => String(s).trim()).filter(Boolean).join(',');

}
const sameVal = (k, a, b) => normVal(k, a) === normVal(k, b);
/** 给人看的值（默认值、继承值） */
function valText(k, v) {

function setCtl(el, v) {

function controlHtml(k, m, v) {

    return `<label class="sw"><input type="checkbox" data-k="${k}" data-t="bool" ${v ? 'checked' : ''}><i></i></label><span class="muted small" data-bv="${k}">${v ? '已开启' : '已关闭'}</span>`;
  }
  if (m.type === 'number') {
    const min = m.min == null ? '' : `min="${m.min}"`, max = m.max == null ? '' : `max="${m.max}"`, step = m.step == null ? 'step="1"' : `step="${m.step}"`;

  }
  if (m.type === 'enum') {
    return `<select data-k="${k}" data-t="enum" style="max-width:100%">${(m.options || []).map(o => `<option value="${esc(o)}" ${String(v) === String(o) ? 'selected' : ''}>${esc(o === '' ? '（默认 / 留空）' : ((m.optionLabels || {})[o] || o))}</option>`).join('')}</select>`;
  }
  if (m.type === 'textarea') {

    return `<input type="text" style="flex:1;min-width:220px" data-k="${k}" data-t="csv" value="${esc(val)}" placeholder="逗号分隔">`;
  }
  return `<input type="text" style="flex:1;min-width:220px" data-k="${k}" data-t="text" value="${esc(v == null ? '' : v)}" ${m.type === 'quiet' ? 'placeholder="23:00-08:00"' : ''}>`;
}
function fieldHtml(k, m) {
  const v = App.S.config[k];
  const changed = !sameVal(k, v, DEF()[k]);

    <div><div class="lab">${esc(m.label || k)}<span class="tag-changed" data-chg ${changed ? '' : 'hidden'}>改过</span>${m.room ? '<a href="#roomcfg" class="tag-room" data-goroom title="可以在「每群性格」里给某个群单独设">可按群调</a>' : ''}${m.advanced ? '<span class="tag-room">高级</span>' : ''}</div>

}
function savebarHtml(advancedCount) {

/** 普通参数页：页头 + 每个分组一张卡 + 吸底保存栏 */

/** 把若干参数分组画进 host（参数页、各页底部的「⚙ 参数」折叠区共用） */
function renderParamsInto(host, groupIds, navId, opts) {
  opts = opts || {};

  const groups = (S.groups || []).filter(g => groupIds.includes(g.id));

  // 只有一个分组、页头已经写了标题和说明时，卡片上不再重复

      ${fields.map(([k, m]) => fieldHtml(k, m)).join('') || ui.empty('这个分组还没有参数')}</div>`;
  }).join('') + savebarHtml(advancedCount);
  bindParams(host, navId, () => renderParamsInto(host, groupIds, navId, opts));
  // 放在页面底部「⚙ 参数」折叠区里的：记住开没开，保存后整页重画也不会收起来

/** 参数控件的公共行为：滑杆 ↔ 数字框、改过标记、恢复默认、草稿保护、保存 */
function bindParams(host, navId, rerender) {
  const S = App.S, meta = META();
  const syncHuman = (k, val) => {
    const hv = host.querySelector(`[data-hv="${k}"]`);
    if (!hv) return;
    const raw = String(val == null ? '' : val).trim();
    hv.textContent = raw === '' || Number.isNaN(Number(raw)) ? '' : humanValue(k, Number(raw), meta[k] || {});
  };
  const markChanged = (k) => {
    const el = host.querySelector(`[data-k="${k}"]`);
    const row = host.querySelector(`[data-field="${k}"]`);
    if (!el || !row) return;
    const changed = !sameVal(k, ctlVal(el), DEF()[k]);
    row.classList.toggle('changed', changed);
    const t = row.querySelector('[data-chg]'); if (t) t.hidden = !changed;
    const d = row.querySelector('[data-def]'); if (d) d.hidden = !changed;
  };
  const unsaved = () => $$('[data-k]', host).filter(el => {
    const k = el.dataset.k;
    if (el.dataset.t === 'number' && (String(el.value).trim() === '' || Number.isNaN(Number(el.value)))) return true;
    return !sameVal(k, ctlVal(el), S.config[k]);
  }).length;
  const paintDirty = () => {
    const n = unsaved();
    App.dirty = n > 0;
    const bar = $('#savebar', host), hint = $('#save-hint', host), dis = $('#btn-discard', host);
    if (bar) bar.classList.toggle('dirty', n > 0);
    if (hint) hint.textContent = n ? `● 改了 ${n} 项，还没保存` : '没有未保存的修改';
    if (dis) dis.hidden = !n;
  };
  // 草稿保护：重画（刷新 / 切高级参数）后把没保存的编辑填回去
  if (App.draftNav === navId && App.draft) {
    $$('[data-k]', host).forEach(el => {
      const k = el.dataset.k;
      if (!(k in App.draft)) return;
      if (el.dataset.t === 'bool') el.checked = !!App.draft[k];
      else el.value = App.draft[k];
      const r = host.querySelector(`input[data-range="${k}"]`); if (r) r.value = el.value;
      if (el.dataset.t === 'number') syncHuman(k, el.value);
      markChanged(k);
    });
  }
  $$('input[data-range]', host).forEach(r => {
    const k = r.dataset.range;
    r.oninput = () => { const n = host.querySelector(`input[data-k="${k}"]`); if (n) { n.value = r.value; n.dispatchEvent(new Event('input', { bubbles: true })); } };
  });
  $$('[data-k]', host).forEach(el => {
    const k = el.dataset.k;
    const on = () => {
      if (el.dataset.t === 'bool') { const bv = host.querySelector(`[data-bv="${k}"]`); if (bv) bv.textContent = el.checked ? '已开启' : '已关闭'; }
      if (el.dataset.t === 'number') { const r = host.querySelector(`input[data-range="${k}"]`); if (r && r !== el) r.value = el.value; syncHuman(k, el.value); }
      const len = host.querySelector(`[data-len="${k}"]`); if (len) len.textContent = String(el.value || '').length + ' 字';
      markChanged(k);
    };
    el.addEventListener('input', on);
    el.addEventListener('change', on);
  });
  $$('[data-reset]', host).forEach(b => b.onclick = () => {
    const k = b.dataset.reset;
    const el = host.querySelector(`[data-k="${k}"]`); if (!el) return;
    setCtl(el, DEF()[k]);
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  });
  $$('[data-goroom]', host).forEach(a => a.onclick = (e) => { e.preventDefault(); go('roomcfg'); });
  const capture = (e) => {
    const t = e && e.target;
    if (!t || !t.dataset || !('k' in t.dataset)) return;
    App.draftNav = navId;
    App.draft = {};
    $$('[data-k]', host).forEach(x => { App.draft[x.dataset.k] = x.dataset.t === 'bool' ? x.checked : x.value; });
    paintDirty();
  };
  host.oninput = capture;
  host.onchange = capture;
  paintDirty();

  const adv = $('#adv-toggle', host);
  if (adv) adv.onchange = () => {
    // 切换"显示高级参数"会重画：先把当前编辑值存成草稿，重画后填回去
    App.draftNav = navId;
    App.draft = {};
    $$('[data-k]', host).forEach(x => { App.draft[x.dataset.k] = x.dataset.t === 'bool' ? x.checked : x.value; });
    App.showAdvanced = adv.checked;
    localStorage.setItem('qb:adv', adv.checked ? '1' : '0');
    rerender();
  };
  const dis = $('#btn-discard', host);
  if (dis) dis.onclick = async () => {
    if (!(await uiConfirm('放弃修改？', '这一页改过、还没保存的参数会恢复成现在生效的值。', { okText: '放弃修改', danger: true }))) return;
    App.draft = null; App.draftNav = ''; App.dirty = false;
    rerender();
  };
  $('#btn-save', host).onclick = async () => {
    const patch = {};
    const skipped = [];
    $$('[data-k]', host).forEach(el => {
      const k = el.dataset.k, t = el.dataset.t;
      if (t === 'bool') patch[k] = el.checked;
      else if (t === 'number') {
        const raw = String(el.value).trim();
        // 输入框被清空时不要偷偷写成 0，跳过并提示
        if (raw === '' || Number.isNaN(Number(raw))) { skipped.push(k); return; }
        patch[k] = Number(raw);
      } else if (t === 'csv') patch[k] = el.value.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean);
      else patch[k] = el.value;
    });
    const noChange = !skipped.length && Object.entries(patch).every(([k, v]) => sameVal(k, v, S.config[k]));
    if (noChange) { toast('没有检测到任何改动', 'err'); return; }
    try {
      const r = await busy('#btn-save', () => api('/config', { method: 'POST', body: JSON.stringify({ patch }) }));
      App.dirty = false;
      App.draft = null;
      App.draftNav = '';
      // 夹取反馈：服务端会按 min/max 调整，界面上要让人知道
      const adjusted = [];
      for (const [k, v] of Object.entries(patch)) {
        const got = (r.applied || {})[k];
        if (got === undefined) continue;
        if (!sameVal(k, got, v)) adjusted.push(`${(meta[k] || {}).label || k} ${valText(k, v)}→${valText(k, got)}`);
      }
      toast('已保存' + (skipped.length ? `（${skipped.length} 项为空已跳过）` : '') + (adjusted.length ? `；${adjusted.length} 项按范围调整：${adjusted.slice(0, 2).join('、')}` : ''), 'ok');
      if (r && r.rejected && Object.keys(r.rejected).length) toast('部分字段没保存：' + Object.keys(r.rejected).join('、'), 'err');
      // 整页重画（页面上方可能用到刚改的参数），参数区留在屏幕上原来的位置
      const m = mainEl(), sel = host.id ? '#' + host.id : '';
      const off = m && sel ? host.getBoundingClientRect().top - m.getBoundingClientRect().top : null;
      const sc = m ? m.scrollTop : 0;
      await refresh();
      if (off != null) pinScroll(() => $(sel), off);
      else if (mainEl()) mainEl().scrollTo({ top: sc, behavior: 'instant' });
      flashSaved($('#btn-save'));
    } catch (e) { toast('保存失败：' + e.message, 'err'); }
  };
}

        <div class="gl">${s.bad ? '失效' : s.subType ? '表情' : '图片'}${s.uses ? ' · 用过 ' + s.uses + ' 次' : ''}</div>
        <div class="ga"><button class="gb g-send" data-send="${esc(s.id)}" title="发到所选的群" aria-label="发送">${ic('send')}</button>` +
        `<button class="gb g-fav${s.favorite ? ' on' : ''}" data-fav="${esc(s.id)}" title="${s.favorite ? '已收进 QQ 收藏' : '收进 QQ 收藏'}" aria-label="收藏" ${s.favorite || (s.bad && !s.hasFile) ? 'disabled' : ''}>${ic('star')}</button>` +

    $$('[data-fav]', box).forEach(el => el.onclick = (ev) => { ev.stopPropagation(); fav(el.dataset.fav, el); });
    $$('[data-open]', box).forEach(el => {

            <div class="kv" style="margin-top:14px"><span>来源</span><span>${esc(s.from || '—')}</span><span>用过</span><span>${s.uses || 0} 次</span><span>状态</span><span>${s.bad ? '已失效' : '可用'}</span><span>本地文件</span><span>${s.hasFile ? '有' : '没有'}</span><span>QQ 收藏</span><span data-favtxt>${s.favorite ? '已收藏' : '没收藏'}</span></div>`,
          foot: `<button class="btn danger" data-dd>删除</button><span class="grow"></span><button class="btn" data-df ${s.favorite || (s.bad && !s.hasFile) ? 'disabled' : ''}>⭐ ${s.favorite ? '已收藏' : '收藏'}</button><button class="btn primary" data-ds ${s.bad ? 'disabled' : ''}>发到所选的群</button>`,

    });
  };
  const clean = async (what, label) => {
    if (!(await uiConfirm('批量清理：' + label + '？', what === 'bad' ? '删掉所有链接已经过期、发不出去的表情。' : '删掉所有普通图片（不是 QQ 表情包的），只留表情包。', { okText: '清理', danger: true }))) return;

  load();

/* ═════════════════ 成长曲线 ═════════════════ */
const MOOD_COLORS = {
  开心: '#5ED39A', 平静: '#9CCBF0', 得意: '#FFD25E', 馋: '#FFB067',
  困: '#9AA8FF', 委屈: '#C3AEFF', 被惹到: '#FF8C8C', 无聊: '#B4BFCC',
};
async function renderCurve() {
  const S = App.S;
  const rooms = (S.rooms || []).filter(r => r.isGroup || r.allowed);
  const span = App.curveSpan || 30;
  view.innerHTML = ui.pageHd('📈', '成长曲线', '每天回复时记一格：当天出现过的心情 + 最高亲密度（只有托管会话有记录）',
      `<select id="cv-room">${rooms.map(r => `<option value="${esc(r.roomId)}"${r.roomId === App.curveRoom ? ' selected' : ''}>${esc(r.roomName || r.roomId)}</option>`).join('') || '<option value="">（没有会话）</option>'}</select>
       <select id="cv-span">${[7, 30, 90].map(n => `<option value="${n}"${n === span ? ' selected' : ''}>最近 ${n} 天</option>`).join('')}</select>`) +
    `<div id="cv-box"><div class="grid two"><div class="card">${ui.loading('chart')}</div><div class="card">${ui.loading('chart')}</div></div></div>`;
  const load = async () => {
    const room = ($('#cv-room') || {}).value;
    const box = $('#cv-box'); if (!box) return;
    if (!room) { box.innerHTML = ui.empty('还没有会话', '等群里来几条消息就有了'); return; }
    App.curveRoom = room;
    try {
      const d = await action('curve.get', { room });
      paint((d.days || []).slice(-(App.curveSpan || 30)));
    } catch (e) { box.innerHTML = ui.error('读取失败：' + e.message); }
  };
  const paint = (days) => {
    const box = $('#cv-box'); if (!box) return;
    if (!days.length) { box.innerHTML = ui.empty('还没有记录', '多聊几天就有了'); return; }
    const W = 720, H = 220, L = 34, R = 10, T = 16, B = 28, iw = W - L - R, ih = H - T - B, n = days.length, step = iw / n;
    const bw = Math.max(3, Math.min(22, step * 0.62));
    const tot = (d) => Object.values(d.m || {}).reduce((a, b) => a + b, 0);
    const maxTotal = Math.max(1, ...days.map(tot));
    const maxBond = Math.max(1, ...days.map(d => d.bond || 0));
    const every = Math.max(1, Math.ceil(n / 10));
    const xLab = days.map((d, i) => ((i % every === 0 && n - 1 - i >= every / 2) || i === n - 1)
      ? `<text class="ax" x="${(L + i * step + step / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(d.day.slice(5))}</text>` : '').join('');
    const grid = (max) => [0, 0.5, 1].map(f => {
      const y = T + ih - f * ih;
      return `<line class="gl" x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="ax" x="${L - 6}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${Math.round(max * f)}</text>`;
    }).join('');
    const tipOf = (d) => d.day + '\n' + (Object.entries(d.m || {}).filter(([, v]) => v).map(([k, v]) => k + ' ' + v).join(' · ') || '没有心情记录') + '\n亲密度 ' + (d.bond || 0);
    // 心情：每天一根圆头柱子，按心情分段上色
    let cols = '';
    days.forEach((d, i) => {
      const x = L + i * step + (step - bw) / 2, h = (tot(d) / maxTotal) * ih, top = T + ih - h;
      let y = T + ih, segs = '';
      for (const [mood, v] of Object.entries(d.m || {})) {
        if (!v) continue;
        const sh = (v / maxTotal) * ih;
        y -= sh;
        segs += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(sh + 0.6).toFixed(1)}" fill="${MOOD_COLORS[mood] || '#B8C4D2'}"/>`;
      }
      cols += `<g class="col" data-tip="${esc(tipOf(d))}"><rect class="hit" x="${(L + i * step).toFixed(1)}" y="${T}" width="${step.toFixed(1)}" height="${ih}"/>` +
        (h > 0 ? `<clipPath id="cvc${i}"><rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(6, bw / 2).toFixed(1)}"/></clipPath>` +
          `<g clip-path="url(#cvc${i})">${segs}</g><rect data-anchor x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="1" fill="none"/>` : '') + '</g>';
    });
    // 亲密度：平滑曲线 + 下方渐变；点不多时每天一个点，多了只在悬停时出现
    const pts = days.map((d, i) => [L + i * step + step / 2, T + ih - ((d.bond || 0) / maxBond) * ih]);
    const line = smoothPath(pts, T, T + ih);
    const area = line + ` L${pts[n - 1][0].toFixed(1)},${T + ih} L${pts[0][0].toFixed(1)},${T + ih} Z`;
    const dots = days.map((d, i) => {
      const [x, y] = pts[i], last = i === n - 1;
      return `<g class="pt${last ? ' last' : ''}${n <= 31 ? ' on' : ''}" data-tip="${esc(d.day + '\n亲密度 ' + (d.bond || 0))}"><rect class="hit" x="${(L + i * step).toFixed(1)}" y="${T}" width="${step.toFixed(1)}" height="${ih}"/>` +
        `<line class="vl" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${T}" y2="${T + ih}"/><circle class="dot" data-anchor cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${last ? 4.6 : 3.2}"/></g>`;
    }).join('');
    const legend = Object.keys(MOOD_COLORS).filter(m => days.some(d => d.m && d.m[m]))
      .map(m => `<span class="chip"><i class="lg" style="background:${MOOD_COLORS[m]}"></i>${m}</span>`).join('');
    box.innerHTML = `<div class="grid two">
      <div class="card"><div class="card-hd">📊 心情分布 <span class="muted">鼠标放到柱子上看当天</span></div>
        <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="心情分布">${grid(maxTotal)}${cols}${xLab}</svg>
        <div class="chips" style="margin-top:8px">${legend || '<span class="muted small">还没有心情记录</span>'}</div></div>
      <div class="card"><div class="card-hd">💗 亲密度 <span class="muted">当天最高 · 现在 ${days[n - 1].bond || 0}</span></div>
        <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="亲密度">
          <defs><linearGradient id="cv-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.32"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
          ${grid(maxBond)}<path class="area" d="${area}" fill="url(#cv-area)"/><path class="ln" d="${line}"/>${dots}${xLab}</svg></div></div>`;
  };
  $('#cv-room').onchange = load;
  $('#cv-span').onchange = (e) => { App.curveSpan = Number(e.target.value) || 30; load(); };
  load();
}

const TACT = ['难过', '生气', '害怕', '尴尬'];

  const all = (data.facts || []).slice().reverse();
  const F = App.factsFilter || (App.factsFilter = { q: '', src: 'all', emo: 'all', who: 'all', imp: 'all', flag: 'all', sort: 'new' });
  const fuzzyBelow = Number(App.S.config.fuzzyBelow != null ? App.S.config.fuzzyBelow : 0.3);
  const people = new Map();
  all.forEach(f => { if (f.who) people.set(f.who, f.whoName || f.who); });
  const sel = (id, list, cur) => `<select data-ff="${id}">${list.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  host.innerHTML = `<div class="toolbar">
      <input type="search" class="search" data-ff="q" placeholder="搜记忆内容" value="${esc(F.q)}">
      ${sel('src', [['all', '全部来源'], ['亲口说', '亲口说'], ['别人说', '别人说'], ['推测', '推测'], ['观察', '观察'], ['手动添加', '手动添加'], ['', '未知']], F.src)}
      ${sel('emo', [['all', '全部情绪']].concat(EMOTIONS.map(e => [e, (EMO_ICON[e] || '') + ' ' + e])), F.emo)}
      ${sel('who', [['all', '关于所有人'], ['', '关于群']].concat([...people.entries()].map(([id, n]) => [id, n])), F.who)}
      ${sel('imp', [['all', '全部重要度'], ['4', '重要（≥4）'], ['3', '≥3'], ['2', '≤2']], F.imp)}
      ${sel('flag', [['all', '全部'], ['chain', '有变化的'], ['fuzzy', '记得不太清的'], ['links', '有联想的'], ['due', '要跟进的'], ['tact', '情绪强烈的']], F.flag)}
      ${sel('sort', [['new', '最近记下的'], ['imp', '重要的在前'], ['emo', '情绪强的在前'], ['fresh', '快忘了的在前'], ['used', '常被想起的']], F.sort)}
      ${opts.addBtn ? '<button class="btn primary sm" data-add>＋ 记一条</button>' : ''}
    </div><div class="small muted" data-count style="margin:-4px 0 8px"></div><div class="list" data-list></div>`;
  const paint = () => {
    const q = F.q.trim().toLowerCase();
    let list = all.filter(f => {
      if (q && !String(f.text).toLowerCase().includes(q) && !String(f.whoName || '').toLowerCase().includes(q)) return false;
      if (F.src !== 'all' && (f.source || '') !== F.src) return false;
      if (F.emo !== 'all' && f.emotion !== F.emo) return false;
      if (F.who !== 'all' && (f.who || '') !== F.who) return false;
      if (F.imp === '4' && f.importance < 4) return false;
      if (F.imp === '3' && f.importance < 3) return false;
      if (F.imp === '2' && f.importance > 2) return false;
      if (F.flag === 'chain' && f.versions < 2) return false;
      if (F.flag === 'fuzzy' && !(f.freshness < fuzzyBelow)) return false;
      if (F.flag === 'links' && !f.links) return false;
      if (F.flag === 'due' && !f.due) return false;
      if (F.flag === 'tact' && !(f.intensity >= 4)) return false;
      return true;
    });
    const by = { imp: (a, b) => b.importance - a.importance, emo: (a, b) => b.intensity - a.intensity, fresh: (a, b) => a.freshness - b.freshness, used: (a, b) => b.uses - a.uses };
    if (by[F.sort]) list = list.slice().sort((a, b) => by[F.sort](a, b) || (b.at - a.at));
    host.querySelector('[data-count]').textContent = `${list.length} / ${all.length} 条 · 点一条就能改`;
    const box = host.querySelector('[data-list]');
    box.innerHTML = list.length ? list.map(f => factRowHtml(f, fuzzyBelow)).join('') : (all.length ? ui.empty('没有符合条件的记忆', '换个筛选条件试试') : ui.empty('还没有长期记忆', '聊天攒够一批后会自动提炼，也可以点「立即提炼」或者手动记一条'));
    $$('[data-fid]', box).forEach(row => {
      const open = () => {
        $$('.lrow.sel', box).forEach(x => x.classList.remove('sel'));
        row.classList.add('sel');
        const f = all.find(x => x.id === row.dataset.fid);
        if (f) openFactDrawer(room, f, () => factsBrowser(host, room, opts));
      };
      row.onclick = open;
      row.onkeydown = (e) => { if (e.key === 'Enter') open(); };
    });
  };
  $$('[data-ff]', host).forEach(el => {
    const k = el.dataset.ff;
    el[k === 'q' ? 'oninput' : 'onchange'] = () => { F[k] = el.value; paint(); };
  });
  const add = host.querySelector('[data-add]');
  if (add) add.onclick = async () => {
    const text = await uiPrompt('记一条长期记忆', '写一句它应该一直记住的事，比如：主人喜欢深夜写代码。', '', { icon: '📌', okText: '记下', placeholder: '要记住的事' });
    if (!text || !text.trim()) return;
    try { await action('memory.add', { room, add: text.trim() }); toast('已记下', 'ok'); factsBrowser(host, room, opts); }
    catch (e) { toast('保存失败：' + e.message, 'err'); }
  };
  paint();
}

/* ═════════════════ 记忆（会话的长期记忆、画像、摘要、关系） ═════════════════ */
function memRoomsList() {
  const S = App.S;
  const managed = (S.config.memoryRooms || []).map(String);
  const list = (S.rooms || []).map(r => ({ id: String(r.roomId), name: r.roomName || r.roomId, managed: managed.includes(String(r.roomId)) }));
  for (const id of managed) if (!list.some(x => x.id === id)) list.push({ id, name: id, managed: true });
  return list.sort((a, b) => (b.managed ? 1 : 0) - (a.managed ? 1 : 0));
}
async function renderMemoryPage() {
  const rooms = memRoomsList();
  if (!App.memRoom || !rooms.some(r => r.id === App.memRoom)) App.memRoom = (rooms.find(r => r.managed) || rooms[0] || {}).id || '';
  const TABS = [['facts', '📋 长期记忆'], ['profile', '🪪 画像'], ['summary', '📝 摘要'], ['relations', '👥 关系'], ['graph', '🕸 关系图']];
  App.memTab = App.memTab || 'facts';
  view.innerHTML = ui.pageHd('🧠', '记忆', '每个会话一个独立的记忆文件夹；只有「维护记忆的会话」名单里的才记',
      `<select id="mem-room">${rooms.map(r => `<option value="${esc(r.id)}"${r.id === App.memRoom ? ' selected' : ''}>${esc(r.name)}${r.managed ? '' : '（不记忆）'}</option>`).join('') || '<option value="">（还没有会话）</option>'}</select>
       <button class="btn primary" id="mem-extract">✨ 让模型提炼</button>
       <span style="position:relative"><button class="btn icon" id="mem-more" title="更多">⋯</button><div id="mem-menu" class="nav-results" style="right:0;left:auto;width:180px;top:40px"><a href="#" data-mm="export">📦 导出记忆</a><a href="#" data-mm="clear" class="bad-t">🗑 清空这个会话的记忆</a></div></span>`) +
    ui.tabs(TABS.map(([id, label]) => ({ id, label })), App.memTab, 'data-memtab') +
    `<div id="mem-body"></div>
    <details class="fold"><summary>⚙ 记忆参数 <span class="muted">维护记忆的会话、每次带几条、提炼频率……</span></summary><div class="fold-body" id="params-host"></div></details>`;
  renderParamsInto($('#params-host'), ['memory'], 'memory');
  const room = () => App.memRoom;
  const isManaged = () => (rooms.find(r => r.id === room()) || {}).managed;
  const body = () => $('#mem-body');
  const show = async () => {
    $$('[data-memtab]').forEach(b => b.classList.toggle('on', b.dataset.memtab === App.memTab));
    const b = body(); if (!b) return;
    if (!room()) { b.innerHTML = ui.empty('还没有会话', '等群里来几条消息就有了'); return; }
    if (!isManaged()) {
      b.innerHTML = ui.empty('这个会话不记忆', '它不在「维护记忆的会话」名单里，所以不存任何记忆。想让它记，就把会话号加进名单。', '<button class="btn primary" id="mem-goadd">去加上</button>');
      $('#mem-goadd').onclick = () => focusField('memoryRooms');
      return;
    }
    if (App.memTab === 'facts') {
      b.innerHTML = '<div class="card"><div id="mem-facts"></div></div>';
      return factsBrowser($('#mem-facts'), room(), { addBtn: true });
    }
    if (App.memTab === 'graph') return showGraph();
    b.innerHTML = '<div class="card">' + ui.loading() + '</div>';
    try {
      const r = await action('memory.profile', { room: room() });
      const map = {
        profile: ['🪪 人物画像', r.profile, 'memory.regenProfile', '生成画像', 'profile.md：这里有哪些人、性格、禁忌、常用梗'],
        summary: ['📝 滚动摘要', r.summary, 'memory.regenSummary', '生成摘要', 'summary.md：之前聊过什么（把旧摘要和最近对话合并）'],
        relations: ['👥 群内关系', r.relations, 'memory.regenRelations', '分析关系', 'relations.md：谁和谁常互动、亲疏、相处方式'],
      }[App.memTab];
      b.innerHTML = `<div class="card"><div class="card-hd">${map[0]} <span class="muted">${esc(map[4])}</span><span class="acts"><button class="btn soft sm" id="mem-regen">${map[1] ? '🔄 重新' + map[3].slice(2) : '✨ ' + map[3]}</button></span></div>
        ${map[1] ? `<div class="md">${mdToHtml(map[1])}</div>` : ui.empty('还没有内容', '点右上角让模型生成一份')}
        <div class="tiny muted" style="margin-top:12px">目录：${esc(r.dir || '')}</div></div>`;
      $('#mem-regen').onclick = async () => {
        try { await busy('#mem-regen', () => action(map[2], { room: room() })); toast('已更新', 'ok'); show(); }
        catch (e) { toast('生成失败：' + e.message, 'err'); }
      };
    } catch (e) { b.innerHTML = ui.error('读取失败：' + e.message); }
  };
  const showGraph = async () => {
    const b = body();
    b.innerHTML = `<div class="card"><div class="card-hd">🕸 关系图 <span class="muted">按最近的聊天统计谁和谁常接话（不花 token）</span>
      <span class="acts"><button class="btn sm icon" data-zoom="-1">－</button><span class="small muted" id="zoom-l">${Math.round(App.graphZoom * 100)}%</span><button class="btn sm icon" data-zoom="1">＋</button><button class="btn sm" data-zoom="0">复位</button></span></div><div id="graph-box">${ui.loading()}</div></div>`;
    const paintG = (g) => {
      const box = $('#graph-box'); if (!box) return;
      if (!g || !g.nodes || !g.nodes.length) { box.innerHTML = ui.empty('还没有关系图', '先在「👥 关系」里点「分析关系」'); return; }
      const W = 620, H = 400, cx = W / 2, cy = H / 2 - 6, R = Math.min(W, H) / 2 - 82, n = g.nodes.length;
      const pos = new Map(g.nodes.map((x, i) => [x.id, { x: cx + R * Math.cos(i / n * Math.PI * 2 - Math.PI / 2), y: cy + R * Math.sin(i / n * Math.PI * 2 - Math.PI / 2) }]));
      const maxW = Math.max(1, ...g.edges.map(e => e.w)), maxM = Math.max(1, ...g.nodes.map(x => x.msgs));
      const f = (v) => v.toFixed(1);
      const nameOf = (id) => { const x = g.nodes.find(y => y.id === id); return id === 'self' ? '我' : String((x && x.name) || id); };
      // 连线：稍微往中间弯一点，越常接话越粗越深；悬停看接话次数
      const lines = g.edges.map(e => {
        const a = pos.get(e.a), c = pos.get(e.b); if (!a || !c) return '';
        const mx = (a.x + c.x) / 2, my = (a.y + c.y) / 2, qx = mx + (cx - mx) * 0.22, qy = my + (cy - my) * 0.22, k = e.w / maxW;
        const d = `M${f(a.x)},${f(a.y)} Q${f(qx)},${f(qy)} ${f(c.x)},${f(c.y)}`;
        return `<g class="ge" data-tip="${esc(nameOf(e.a) + ' ↔ ' + nameOf(e.b) + '\n接话 ' + e.w + ' 次')}"><path class="hit" d="${d}"/>` +
          `<path class="ln" d="${d}" style="stroke-width:${f(1.5 + 6 * k)}px;stroke-opacity:${(0.22 + 0.55 * k).toFixed(2)}"/>` +
          `<circle data-anchor cx="${f((a.x + 2 * qx + c.x) / 4)}" cy="${f((a.y + 2 * qy + c.y) / 4)}" r="1" fill="none"/></g>`;
      }).join('');
      // 人：头像颜色和别处一样（按人固定）；"我"是小鲸鱼
      const dots = g.nodes.map(x => {
        const p = pos.get(x.id), r = 16 + 14 * x.msgs / maxM, self = x.id === 'self';
        const nm = nameOf(x.id), short = nm.length > 6 ? nm.slice(0, 6) + '…' : nm;
        // "我"：把小鲸鱼的图形直接画进节点（套一层 <svg> 时 Chrome 不认 CSS 宽高，会撑满整张图）
        const ww = r * 1.6, wh = ww * 0.8;
        const inner = self
          ? `<g class="wh calm" transform="translate(${f(p.x - ww / 2)},${f(p.y - wh / 2 - 1)}) scale(${(ww / 124).toFixed(3)})">${whale('calm', ww).replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '')}</g>`
          : `<text class="gi" x="${f(p.x)}" y="${f(p.y + r * 0.34)}" text-anchor="middle" style="font-size:${f(r * 0.92)}px">${esc(nm.slice(0, 1))}</text>`;
        return `<g class="gn" data-tip="${esc((self ? '我（小鲸鱼）' : nm) + '\n最近说了 ' + x.msgs + ' 条')}" style="--c:${self ? 'var(--wh-body)' : avColor(x.id)}">` +
          `<circle class="halo" cx="${f(p.x)}" cy="${f(p.y)}" r="${f(r + 6)}"/><circle class="nd" data-anchor cx="${f(p.x)}" cy="${f(p.y)}" r="${f(r)}"/>${inner}` +
          `<text class="gl" x="${f(p.x)}" y="${f(p.y + r + 17)}" text-anchor="middle">${esc(short)}</text></g>`;
      }).join('');
      box.innerHTML = `<div class="graph"><svg viewBox="0 0 ${W} ${H}" width="${Math.round(W * App.graphZoom)}" height="${Math.round(H * App.graphZoom)}" style="color:var(--text);display:block;margin:auto" role="img" aria-label="谁和谁常接话">${lines}${dots}</svg></div>`;
    };
    $$('[data-zoom]').forEach(z => z.onclick = () => {
      const d = Number(z.dataset.zoom);
      App.graphZoom = d === 0 ? 1 : Math.min(2.4, Math.max(0.6, App.graphZoom + d * 0.2));
      const l = $('#zoom-l'); if (l) l.textContent = Math.round(App.graphZoom * 100) + '%';
      if (App.lastGraph) paintG(App.lastGraph);
    });
    try { const g = await action('memory.graph', { room: room() }); App.lastGraph = g; paintG(g); }
    catch (e) { const box = $('#graph-box'); if (box) box.innerHTML = ui.error('读取关系图失败：' + e.message); }
  };
  $$('[data-memtab]').forEach(b => b.onclick = () => { App.memTab = b.dataset.memtab; show(); });
  $('#mem-room').onchange = (e) => { App.memRoom = e.target.value; show(); };
  $('#mem-extract').onclick = async () => {
    if (!room()) return;
    try {
      const r = await busy('#mem-extract', () => action('memory.extract', { room: room() }));
      toast(r.ok ? `提炼完了：新增 ${r.added || 0} 条` : (r.error || '提炼失败'), r.ok ? 'ok' : 'err');
      if (App.memTab === 'facts') show();
    } catch (e) { toast('提炼失败：' + e.message, 'err'); }
  };
  const menu = $('#mem-menu');
  $('#mem-more').onclick = (e) => { e.stopPropagation(); menu.classList.toggle('show'); };
  view.onclick = () => menu.classList.remove('show');
  $$('[data-mm]', menu).forEach(a => a.onclick = async (e) => {
    e.preventDefault(); menu.classList.remove('show');
    if (!room()) return;
    if (a.dataset.mm === 'export') {
      try {
        const r = await action('memory.export', { room: room() });
        const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), room: room(), files: r.files }, null, 2)], { type: 'application/json' });
        const el = document.createElement('a');
        el.href = URL.createObjectURL(blob); el.download = 'memory-' + room() + '.json'; el.click();
        setTimeout(() => URL.revokeObjectURL(el.href), 8000);
        toast('已导出（服务端也留了一份：' + r.file + '）', 'ok');
      } catch (err) { toast('导出失败：' + err.message, 'err'); }
    } else {
      if (!(await uiConfirm('清空这个会话的长期记忆？', '「' + ((rooms.find(r => r.id === room()) || {}).name || room()) + '」的长期记忆会全部清掉。建议先导出一份。', { okText: '清空', danger: true }))) return;
      try { await action('memory.clear', { room: room() }); toast('已清空', 'ok'); show(); }
      catch (err) { toast('清空失败：' + err.message, 'err'); }
    }
  });
  show();
}

        ui.stat({ icon: '🗄', label: '原文归档', value: !a.enabled ? '<small>已关</small>' : !a.available ? '<small>不可用</small>' : ((a.room && a.room.count) || 0), unit: a.enabled && a.available ? '条' : '', kind: !a.enabled || !a.available ? 'warn' : '', desc: a.size ? (a.size / 1048576).toFixed(1) + ' MB' + (a.fts ? '' : ' · 无全文索引') : '', go: 'archive' }),
        ui.stat({ icon: '🧭', label: '语义检索', value: !sem.enabled ? '<small>已关</small>' : sem.ready ? '<small>就绪</small>' : sem.loading ? '<small>加载中</small>' : '<small>' + (sem.error ? '出错' : '未加载') + '</small>', kind: !sem.enabled ? '' : sem.ready ? 'ok' : 'warn', desc: sem.enabled ? (sem.cached || 0) + ' 条向量' : '', go: 'semantic' }),
      ].join('');
      $$('[data-go]', box).forEach(c => c.onclick = () => { App.mpTab = c.dataset.go; paintTabs(); showTab(); });
      paintTabs();
    } catch (e) { box.innerHTML = ui.error(e.message); }
  };
  const TABF = { facts: mpFacts, people: mpPeople, insights: mpInsights, archive: mpArchive, daily: mpDaily, why: mpWhy, consolidate: mpConsolidate, recall: mpRecall, follow: mpFollow, semantic: mpSemantic };
  const showTab = async () => {
    const b = body(); if (!b) return;
    if (!room()) {
      b.innerHTML = ui.empty('还没有维护记忆的会话', '先在「🧠 记忆」页把要记的群 / 私聊加进「维护记忆的会话」', '<button class="btn primary" id="mp-goadd">去加上</button>');
      $('#mp-goadd').onclick = () => { App.focusKey = 'memoryRooms'; go('memory'); };
      return;
    }
    b.innerHTML = ui.loading();
    try { await TABF[App.mpTab](room(), b, { reloadStats: loadStats }); }
    catch (e) { b.innerHTML = ui.error(e.message); }
  };
  paintTabs();
  $('#mp-room').onchange = (e) => { App.mpRoom = e.target.value; loadStats(); showTab(); };
  $('#mp-refresh').onclick = () => { loadStats(); showTab(); };
  $('#mp-extract').onclick = async () => {
    if (!room()) return;
    try {
      const r = await busy('#mp-extract', () => action('memplus.extract', { room: room() }));
      toast(`${r.mode === 'ops' ? '增删改模式' : '旧版模式'}：新增 ${r.added || 0}、更新 ${r.updated || 0}、删除 ${r.deleted || 0}${r.confirmed ? '、再次确认 ' + r.confirmed : ''}${r.stories ? '、故事 ' + r.stories : ''}`, 'ok');
      loadStats(); showTab();
    } catch (e) { toast('提炼失败：' + e.message, 'err'); }
  };
  loadStats();
  showTab();
}

/* ── 人物与故事 ── */
function storyNodeDrawer(room, who, name, m, onSaved) {
  const isNew = !m;
  const n = m || { type: '特别的时刻', text: '', emotion: '开心', intensity: 3, at: Date.now(), due: '' };
  const opt = (list, cur) => list.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(t)}</option>`).join('');
  drawer({
    icon: emo(STORY_ICON[n.type] || '✨'), title: isNew ? '添加一件和' + name + '之间的事' : '编辑故事节点', sub: isNew ? '' : '记录方式：' + esc(n.by || '') + ' · ' + esc(fmtDay(n.at)),
    body: `<div class="fld"><label>类型</label><select data-s="type">${opt(STORY_TYPES.map(t => [t, (STORY_ICON[t] || '') + ' ' + t]), n.type)}</select></div>
      <div class="fld"><label>发生了什么</label><textarea data-s="text" style="min-height:80px" placeholder="比如：${esc(name)}帮你找回了表情包">${esc(n.text)}</textarea></div>
      <div class="fld-grid"><div class="fld"><label>情绪</label><select data-s="emotion">${opt(EMOTIONS.map(e => [e, (EMO_ICON[e] || '') + ' ' + e]), n.emotion)}</select></div>
        <div class="fld"><label>强度</label><select data-s="intensity">${opt([1, 2, 3, 4, 5].map(x => [x, String(x)]), n.intensity)}</select></div>
        <div class="fld"><label>日期</label><input type="date" data-s="at" value="${esc(fmtDay(n.at))}"></div>
        <div class="fld"><label>约定到期日（可空）</label><input type="date" data-s="due" value="${esc(n.due || '')}"></div></div>`,
    foot: `${isNew ? '' : '<button class="btn danger" data-del>删除</button>'}<span class="grow"></span><button class="btn primary" data-save>${isNew ? '添加' : '保存'}</button>`,
    onMount: (d, close) => {
      const v = (k) => (d.querySelector(`[data-s="${k}"]`) || {}).value;
      const atOf = () => { const s = v('at'); if (!s) return Date.now(); const [y, mo, da] = s.split('-').map(Number); const t = new Date(n.at || Date.now()); return new Date(y, mo - 1, da, t.getHours(), t.getMinutes()).getTime(); };
      d.querySelector('[data-save]').onclick = async () => {
        const args = { room, who, name, type: v('type'), text: v('text'), emotion: v('emotion'), intensity: Number(v('intensity')), at: atOf(), due: v('due') || '' };
        try {
          await busy(d.querySelector('[data-save]'), () => action(isNew ? 'memplus.story.add' : 'memplus.story.update', isNew ? args : Object.assign(args, { id: n.id })));
          toast(isNew ? '已添加' : '已保存', 'ok'); close(); onSaved();
        } catch (e) { toast('失败：' + e.message, 'err'); }
      };
      const del = d.querySelector('[data-del]');
      if (del) del.onclick = async () => {
        if (!(await uiConfirm('删掉这个故事节点？', n.text, { okText: '删除', danger: true }))) return;
        try { await action('memplus.story.delete', { room, who, id: n.id }); toast('已删除', 'ok'); close(); onSaved(); }
        catch (e) { toast('删除失败：' + e.message, 'err'); }
      };
    },
  });
}

        <span>${esc(p.name)}<div class="tiny muted" style="font-weight:500">QQ ${esc(who)}${p.cardAt ? ' · 人物卡 ' + esc(ago(p.cardAt)) + '更新' : ''}</div></span>

        ${card ? `<div class="md" style="white-space:pre-wrap">${esc(card)}</div>` : '<div class="muted small">还没有人物卡（关于他的记忆攒够几条后会自动写，也可以点右上角）</div>'}</div>
      <div class="card"><div class="card-hd">📖 我们之间的故事 <span class="muted">${story.firstSeenAt ? '认识第 ' + known + ' 天（' + esc(fmtDay(story.firstSeenAt)) + ' 第一次见到）· 聊过 ' + ((story.stats && story.stats.daysTalked) || 0) + ' 天' : '还没记录（开着「我们之间的故事」时，他下次说话就开始记）'}</span>

          <div class="when">${esc(fmtDay(m.at))} · <span class="tt" style="--c:${STORY_COLOR[m.type] || '#8E6CEF'}">${esc(m.type)}</span>${m.emotion && m.emotion !== '平静' ? ' · ' + (EMO_ICON[m.emotion] || '') + esc(m.emotion) + ' ' + m.intensity : ''}${m.due ? ' · 📅 ' + esc(m.due) : ''}<span class="muted" style="font-weight:500"> · ${esc(m.by || '')}</span></div>
          <div class="what">${esc(m.text)}</div></div>`).join('')}</div>` : ui.empty('还没有故事', '被夸、被凶、变熟了、一起玩、约定……都会自动记在这里')}</div>
      <div class="grid two" style="margin-top:14px">

/* ── 💡 理解 ── */
function insightDrawer(room, x, names, onSaved) {
  const isNew = !x;
  const it = x || { text: '', about: '群', confidence: 3, status: '有效', evidence: [] };
  const opt = (list, cur) => list.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(t)}</option>`).join('');
  const aboutOpts = [['群', '👥 群'], ['我', '🐳 我自己']].concat([...names.entries()].map(([id, n]) => [id, '👤 ' + n + '（' + id + '）']));
  if (!aboutOpts.some(([v]) => v === String(it.about))) aboutOpts.push([String(it.about), String(it.about)]);
  drawer({
    icon: '💡', title: isNew ? '手动添加一条认识' : '编辑认识', sub: isNew ? '' : (it.by === '手动' ? '手动添加' : '反思得出') + ' · ' + esc(fmtDay(it.createdAt)) + (it.uses ? ' · 带进回复 ' + it.uses + ' 次' : ''),
    body: `<div class="fld"><label>认识</label><textarea data-i="text" style="min-height:80px" placeholder="比如：阿杰嘴上说减肥，其实经常破戒">${esc(it.text)}</textarea></div>
      <div class="fld-grid"><div class="fld"><label>关于谁</label><select data-i="about">${opt(aboutOpts, it.about)}</select></div>
        <div class="fld"><label>把握度（反思来的算推测，最高 3）</label><select data-i="confidence">${opt([[1, '●○○○○ 1'], [2, '●●○○○ 2'], [3, '●●●○○ 3']], it.confidence)}</select></div></div>
      ${isNew ? '' : `<div class="fld"><label>状态</label><select data-i="status">${opt([['有效', '✅ 有效（会带进回复）'], ['待复核', '⚠️ 待复核（暂时不用）'], ['已撤回', '🗃 已撤回']], it.status)}</select>
        ${it.reviewReason ? `<div class="tiny warn-t" style="margin-top:4px">${esc(it.reviewReason)}</div>` : ''}${it.retiredReason ? `<div class="tiny muted" style="margin-top:4px">撤回原因：${esc(it.retiredReason)}</div>` : ''}</div>
      <h4>📎 依据 <span class="tiny muted">${(it.evidence || []).length} 条原始记忆</span></h4>
      ${(it.evidence || []).length ? `<div class="list">${it.evidence.map(e => `<div class="lrow" style="cursor:default${e.exists ? '' : ';border-color:var(--bad)'}"><div class="lead">${e.exists ? '📌' : '❌'}</div><div class="body"><div class="main ${e.exists ? '' : 'bad-t'}">${e.exists ? esc(e.text) : '这条记忆已被删除或修改'}</div></div></div>`).join('')}</div>` : '<div class="muted small">手动添加的认识没有依据</div>'}`}`,
    foot: `${!isNew && it.status !== '已撤回' ? '<button class="btn danger" data-retire>撤回</button>' : ''}<span class="grow"></span><button class="btn primary" data-save>${isNew ? '添加' : '保存'}</button>`,
    onMount: (d, close) => {
      const v = (k) => (d.querySelector(`[data-i="${k}"]`) || {}).value;
      d.querySelector('[data-save]').onclick = async () => {
        try {
          if (isNew) await action('memplus.insight.add', { room, about: v('about'), text: v('text'), confidence: Number(v('confidence')) });
          else await action('memplus.insight.update', { room, id: it.id, about: v('about'), text: v('text'), confidence: Number(v('confidence')), status: v('status') });
          toast(isNew ? '已添加' : '已保存', 'ok'); close(); onSaved();
        } catch (e) { toast('失败：' + e.message, 'err'); }
      };
      const rt = d.querySelector('[data-retire]');
      if (rt) rt.onclick = async () => {
        const reason = await uiPrompt('撤回这条认识？', '撤回后不会再带进回复；可以写一句原因（可空）。', '', { okText: '撤回', danger: true, placeholder: '比如：已经不是这样了' });
        if (reason === null) return;
        try { await action('memplus.insight.retire', { room, id: it.id, reason: reason || '面板撤回' }); toast('已撤回', 'ok'); close(); onSaved(); }
        catch (e) { toast('撤回失败：' + e.message, 'err'); }
      };
    },
  });
}
async function mpInsights(room, body, ctx) {
  const [r, pl] = await Promise.all([action('memplus.insights.list', { room }), action('memplus.people.list', { room }).catch(() => ({ people: [] }))]);
  const names = new Map((pl.people || []).map(p => [String(p.who), p.name]));
  const aboutName = (a) => a === '群' ? '👥 群' : a === '我' ? '🐳 我自己' : '👤 ' + (names.get(String(a)) || a);
  const items = r.items || [];
  const flt = App.mpInsFlt || 'open';
  const order = { 待复核: 0, 有效: 1, 已撤回: 2 };
  const show = items.filter(x => flt === 'all' ? true : flt === 'open' ? x.status !== '已撤回' : x.status === flt).sort((a, b) => order[a.status] - order[b.status] || (b.updatedAt || 0) - (a.updatedAt || 0));
  body.innerHTML = `<div class="card">
    <div class="note"><span class="ni">💡</span><span>每晚（默认 5 点）从零散的记忆里总结出更深一层的认识，每条都带依据。依据被删或被改时自动变成「待复核」，暂时不带进回复，下次反思时由模型确认、修正或撤回。只总结行为规律和偏好，不下诊断、不评价人品、不碰身份和权限。</span></div>
    <div class="toolbar"><select id="ins-flt">${[['open', '有效 + 待复核'], ['有效', '只看有效'], ['待复核', '只看待复核'], ['已撤回', '只看已撤回'], ['all', '全部']].map(([v, t]) => `<option value="${v}"${flt === v ? ' selected' : ''}>${t}</option>`).join('')}</select>
      <span class="small muted grow">${r.lastReflectAt ? '上次反思：' + esc(fmtTime(r.lastReflectAt)) : '还没反思过'} · 共 ${items.length} 条</span>
      <button class="btn sm" id="ins-add">＋ 手动添加</button><button class="btn primary sm" id="ins-reflect">✨ 立即反思</button></div>
    ${show.length ? `<div class="list">${show.map(x => {
      const ev = x.evidence || [], bad = ev.filter(e => !e.exists).length;
      return `<div class="lrow${x.status === '待复核' ? ' warn' : x.status === '已撤回' ? ' dim' : ''}" data-iid="${esc(x.id)}" tabindex="0"><div class="lead">${x.status === '待复核' ? '⚠️' : x.status === '已撤回' ? '🗃' : '💡'}</div>
        <div class="body"><div class="main">${esc(x.text)}</div><div class="meta">${ui.chip(esc(aboutName(x.about)))}${ui.dots(x.confidence)}
          <span>📎 依据 ${ev.length} 条${bad ? `（<span class="bad-t">${bad} 条失效</span>）` : ''}</span>${ui.chip(esc(x.status), x.status === '待复核' ? 'warn' : x.status === '有效' ? 'ok' : '')}${x.by === '手动' ? ui.chip('手动', 'line') : ''}</div></div>
        <div class="side"><span>${esc(ago(x.updatedAt || x.createdAt))}</span>${x.uses ? `<span>带进回复 ${x.uses} 次</span>` : ''}</div></div>`;
    }).join('')}</div>` : ui.empty('还没有认识', '新记忆攒够几条后每晚自动反思，也可以点「立即反思」')}</div>`;
  const reload = () => { mpInsights(room, body, ctx); ctx.reloadStats(); };
  $('#ins-flt').onchange = (e) => { App.mpInsFlt = e.target.value; mpInsights(room, body, ctx); };
  $('#ins-add').onclick = () => insightDrawer(room, null, names, reload);
  $('#ins-reflect').onclick = async () => {
    try { const o = await busy('#ins-reflect', () => action('memplus.reflect', { room })); toast(`反思完了：新增 ${o.added || 0}、修正 ${o.revised || 0}、撤回 ${o.retired || 0}` + (o.rejected ? `（丢掉不合格的 ${o.rejected} 条）` : ''), 'ok'); reload(); }
    catch (e) { toast('反思失败：' + e.message, 'err'); }
  };
  $$('[data-iid]', body).forEach(row => {
    const open = () => insightDrawer(room, items.find(x => x.id === row.dataset.iid), names, reload);
    row.onclick = open;
    row.onkeydown = (e) => { if (e.key === 'Enter') open(); };
  });
}

/* ── 🗄 原文 ── */
async function mpArchive(room, body) {
  body.innerHTML = `<div class="card"><div class="toolbar"><input type="search" class="search" id="ar-q" placeholder="搜原话，比如：驾照 / 麻辣烫"><button class="btn primary sm" id="ar-go">搜索</button><button class="btn sm" id="ar-recent">看最近 30 条</button></div>
    <div id="ar-box">${ui.empty('搜一句原话试试', '托管会话的每条消息都存进了原文归档，几个月前的原话也能翻到')}</div></div>`;
  const paint = (rows, scored) => {
    $('#ar-box').innerHTML = rows.length ? `<div class="chat">${rows.map(m => msgHtml({ isSelf: m.isSelf, who: m.senderName || m.sender, ts: m.ts, text: m.text + (scored && m.score != null ? '' : ''), room: fmtDay(m.ts) + (scored && m.score != null ? ' · 匹配 ' + Number(m.score).toFixed(2) : '') }, true)).join('')}</div>` : ui.empty('没有结果');
  };

/* ── 🧹 整理记录 ── */
const OP_TXT = { MERGE: ['🔀', '合并'], RESOLVE: ['⚖️', '消矛盾'], PROMOTE: ['⬆️', '升级'], DEMOTE: ['⬇️', '降级'], KEEP: ['✋', '不处理'] };
const ST_KIND = { 已执行: 'ok', 待确认: 'warn', 已撤销: '', 已忽略: '', 不处理: '', 没执行: 'warn' };
function consEntryHtml(e) {
  const op = OP_TXT[e.op] || ['•', e.op];
  const diff = (e.before || []).length || (e.after || []).length
    ? `<div class="diff">${(e.before || []).map(f => `<div class="old">− ${esc(f.text)}</div>`).join('')}${(e.after || []).map(f => `<div class="new">＋ ${esc(f.text)}</div>`).join('')}</div>` : '';
  return `<div class="cons-it" data-cid="${esc(e.id)}"><div class="row" style="gap:8px">${ui.tint(op[0] + ' ' + op[1], OP_COLOR[e.op])}${ui.chip(esc(e.status), ST_KIND[e.status] || '')}<span class="grow small">${esc(e.summary || '')}</span>
      ${e.status === '已执行' ? '<button class="btn sm" data-cact="undo">↩ 撤销</button>' : ''}${e.status === '待确认' ? '<button class="btn primary sm" data-cact="apply">执行</button><button class="btn ghost sm" data-cact="dismiss">忽略</button>' : ''}</div>
    ${e.reason ? `<div class="tiny muted" style="margin-top:4px">原因：${esc(e.reason)}</div>` : ''}${e.error ? `<div class="tiny warn-t" style="margin-top:4px">${esc(e.error)}</div>` : ''}${e.status !== '待确认' ? diff : ''}</div>`;
}
async function mpConsolidate(room, body, ctx) {
  const r = await action('memplus.consolidate.list', { room });
  const items = r.items || [];
  const pending = items.filter(e => e.status === '待确认');
  const nights = [];
  items.filter(e => e.status !== '待确认').forEach(e => { let g = nights.find(n => n.night === e.night); if (!g) { g = { night: e.night, list: [] }; nights.push(g); } g.list.push(e); });
  nights.sort((a, b) => String(b.night).localeCompare(String(a.night)));
  body.innerHTML = `<div class="card">
    <div class="note"><span class="ni">🧹</span><span>每晚（默认 04:30）先用程序找出重复、矛盾、该升级（每日摘要里反复出现）、该降级（不重要又很久没用）的记忆，有候选才调用一次模型。重要度 ≥ 4 或强度 ≥ 4 的不会被降级。每一处改动都能一键撤销。</span></div>
    <div class="toolbar"><span class="small">执行方式</span><select id="cons-mode"><option value="apply"${r.mode === 'apply' ? ' selected' : ''}>直接执行（每一处都能撤销）</option><option value="suggest"${r.mode === 'suggest' ? ' selected' : ''}>只出建议（在这里逐条确认）</option></select>
      <span class="small muted grow" id="cons-hint"></span><button class="btn primary sm" id="cons-run">🧹 立即整理</button></div>
    ${pending.length ? `<div class="card flat" style="margin-bottom:12px;background:var(--warn-soft)"><div class="card-hd">✋ 等你确认的建议 <span class="muted">${pending.length} 处</span></div>${pending.map(consEntryHtml).join('')}</div>` : ''}
    ${nights.length ? nights.map((g, i) => `<details class="fold" ${i === 0 ? 'open' : ''} style="margin-top:10px;box-shadow:none"><summary>🌙 ${esc(g.night)} 晚上 <span class="muted">${g.list.length} 条 · 执行 ${g.list.filter(e => e.status === '已执行').length} · 撤销 ${g.list.filter(e => e.status === '已撤销').length}</span></summary>
        <div class="fold-body">${g.list.map(consEntryHtml).join('')}</div></details>`).join('') : (pending.length ? '' : ui.empty('还没整理过', '每晚会自动整理一次，也可以点「立即整理」'))}</div>`;
  const reload = () => { mpConsolidate(room, body, ctx); ctx.reloadStats(); refreshTodo(); };
  $('#cons-run').onclick = async () => {
    try {
      const o = await busy('#cons-run', () => action('memplus.consolidate.run', { room }));
      toast(o.skipped ? '没有候选，没有调用模型' : `整理完了：执行 ${o.done || 0}、待确认 ${o.pending || 0}、不处理 ${o.kept || 0}`, 'ok'); reload();
    } catch (e) { toast('整理失败：' + e.message, 'err'); }
  };
  $('#cons-mode').onchange = async (ev) => {
    try { await api('/config', { method: 'POST', body: JSON.stringify({ patch: { consolidateMode: ev.target.value } }) }); App.S.config.consolidateMode = ev.target.value; $('#cons-hint').textContent = '✓ 已保存'; }
    catch (e) { toast('保存失败：' + e.message, 'err'); }
  };
  $$('[data-cid]', body).forEach(row => {
    const id = row.dataset.cid;
    const bind = (act, op, msg) => {
      const b = row.querySelector('[data-cact="' + act + '"]');
      if (b) b.onclick = async () => {
        if (act === 'undo' && !(await uiConfirm('撤销这处改动？', row.querySelector('.grow').textContent, { okText: '撤销' }))) return;
        try { await busy(b, () => action('memplus.consolidate.' + op, { room, id })); toast(msg, 'ok'); reload(); } catch (e) { toast(e.message, 'err'); }
      };
    };
    bind('undo', 'undo', '已撤销');
    bind('apply', 'apply', '已执行');
    bind('dismiss', 'dismiss', '已忽略');
  });
}

  const muteBtn = (key) => key ? `<button class="btn ${muted.has(key) ? 'soft' : 'ghost'} xs" data-mute="${esc(key)}" data-on="${muted.has(key) ? '0' : '1'}">${muted.has(key) ? '取消"别主动提"' : '🤐 别主动提'}</button>` : '';

  body.innerHTML = `<div class="grid mini" style="margin-bottom:14px">
      ${ui.stat({ icon: '💭', label: '想起过', value: log.length, unit: '次' })}

    <div class="card"><div class="note"><span class="ni">💭</span><span>重要但很久没提的事，和当前话题相关（或者今天是纪念日、生日临近、一年前的今天）时，回复里有一定概率加一句"如果自然，可以顺嘴提一句"，提不提由模型决定；主动说话时优先拿它当话头。真的说出口了，这件事就记得更牢。强烈难过、生气、尴尬的事和把握度 ≤ 2 的不主动提。</span></div>
      ${log.length ? `<div class="tl">${log.map(x => `<div class="tl-it${x.said ? ' now' : ''}"><span class="ico tint" style="--c:${RECALL_COLOR[x.kind] || '#5B8DEF'}">${RECALL_ICON[x.kind] || '💭'}</span>
        <div class="when">${esc(fmtTime(x.at))} · ${x.mode === 'proactive' ? '主动说话时' : '回复时'}${x.special ? ' · ' + esc(x.special) : ''} ${x.said ? ui.chip('说出口了', 'ok') : ui.chip('没说')}</div>
        <div class="what">${esc(x.text)}</div>${x.saidText ? `<div class="tiny muted">它说：${esc(x.saidText)}</div>` : ''}<div style="margin-top:4px">${muteBtn(x.key)}</div></div>`).join('')}</div>`
        : ui.empty('还没想起过往事', '要等记忆攒得够久（默认 14 天没提）才会想起')}
      <details class="fold" style="box-shadow:none"><summary>🔮 现在可能想起的 <span class="muted">按当前聊天算，只是预览 · ${(r.candidates || []).length} 件</span></summary><div class="fold-body">
        ${(r.candidates || []).length ? `<div class="list">${r.candidates.map(c => `<div class="lrow" style="cursor:default"><div class="lead tint" style="--c:${RECALL_COLOR[c.kind] || '#5B8DEF'}">${RECALL_ICON[c.kind] || '💭'}</div><div class="body"><div class="main">${esc(c.text)}</div>
          <div class="meta">${ui.tint(esc(c.kind), RECALL_COLOR[c.kind])}<span>相关度 ${c.rel}</span>${c.special ? ui.chip(esc(c.special), 'accent') : ''}</div></div><div class="side">${muteBtn(c.key)}</div></div>`).join('')}</div>`
          : ui.empty('现在没有可以想起的往事', '要重要 + 很久没提 + 和话题相关（或者是特别的日子）')}</div></details></div>`;
  $$('[data-mute]', body).forEach(b => b.onclick = async () => {
    try { await action('memplus.recall.mute', { room, key: b.dataset.mute, on: b.dataset.on === '1' }); toast(b.dataset.on === '1' ? '以后不主动提这件' : '已取消', 'ok'); mpRecall(room, body, ctx); }

/* ═════════════════ 诊断 ═════════════════ */
function renderDiag() {
  const h = App.health || App.S.health;
  const items = (h && h.items) || [];
  const rank = { bad: 0, err: 0, warn: 1, ok: 2 };
  const sorted = items.slice().sort((a, b) => (rank[a.level] ?? 1) - (rank[b.level] ?? 1));
  const bad = sorted.filter(i => i.level !== 'ok' && i.level !== 'warn'), warn = sorted.filter(i => i.level === 'warn'), ok = sorted.filter(i => i.level === 'ok');
  const icon = lv => lv === 'ok' ? '✅' : lv === 'warn' ? '⚠️' : '❌';
  const row = it => `<div class="lrow${it.level === 'warn' ? ' warn' : ''}" style="cursor:default${it.level !== 'ok' && it.level !== 'warn' ? ';border-color:var(--bad);background:color-mix(in srgb,var(--bad) 5%,var(--card))' : ''}"><div class="lead">${icon(it.level)}</div>
    <div class="body"><div class="main"><b>${esc(it.name)}</b> <span class="muted">${esc(it.text)}</span></div>${it.advice ? `<div class="meta">💡 建议：${esc(it.advice)}</div>` : ''}</div></div>`;
  view.innerHTML = ui.pageHd('🔬', '诊断', h && h.at ? '上次自检 ' + esc(ago(h.at)) : '还没跑过自检',
      `<button class="btn" id="diag-copy" ${items.length ? '' : 'disabled'}>📋 复制诊断结果</button><button class="btn primary" id="btn-check2">🩺 跑一遍自检</button>`) +
    (items.length ? `<div class="grid tight">${ui.stat({ icon: '❌', label: '异常', value: bad.length, kind: bad.length ? 'bad' : '' })}${ui.stat({ icon: '⚠️', label: '提醒', value: warn.length, kind: warn.length ? 'warn' : '' })}${ui.stat({ icon: '✅', label: '正常', value: ok.length, kind: 'ok' })}</div>
      ${bad.length || warn.length ? `<h3>需要看一下的</h3><div class="list">${[...bad, ...warn].map(row).join('')}</div>` : `<div class="allgood section">${whale('happy', 52)}<span>所有检查都通过了</span></div>`}
      ${ok.length ? `<details class="fold"><summary>✅ 正常的 ${ok.length} 项</summary><div class="fold-body"><div class="list">${ok.map(row).join('')}</div></div></details>` : ''}`
      : ui.empty('还没检查过', '点右上角「跑一遍自检」：会检查连接、模型、配置、文件这些'));
  $('#btn-check2').onclick = async () => {
    try {
      App.health = await busy('#btn-check2', () => action('selfcheck'));
      App.S.health = App.health;
      renderHeader(); updateBadges(); renderDiag();
      toast('自检完成', 'ok');
    } catch (e) { toast('自检失败：' + e.message, 'err'); }
  };
  $('#diag-copy').onclick = () => {
    const text = '【QQ 机器人诊断】' + (h && h.at ? new Date(h.at).toLocaleString('zh-CN', { hour12: false }) : '') + '\n' +
      sorted.map(it => `${icon(it.level)} ${it.name}：${it.text}${it.advice ? '（建议：' + it.advice + '）' : ''}`).join('\n');
    try { navigator.clipboard.writeText(text); toast('已复制，可以直接发给我', 'ok'); } catch { toast('复制失败', 'err'); }
  };
}
