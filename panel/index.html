  if (m.type === 'bool') return `<label class="sw"><input type="checkbox" data-rk="${k}" ${value ? 'checked' : ''}><i></i></label>`;
  if (m.type === 'number') return `<input class="num" type="number" data-rk="${k}" value="${Number(value) || 0}" ${m.min != null ? `min="${m.min}"` : ''} ${m.max != null ? `max="${m.max}"` : ''} ${m.step != null ? `step="${m.step}"` : ''}>${m.unit ? `<span class="unit">${esc(m.unit)}</span>` : ''}`;
  if (m.type === 'csv') return `<input type="text" style="flex:1;min-width:200px" data-rk="${k}" value="${esc(Array.isArray(value) ? value.join(', ') : String(value || ''))}">`;
  if (m.type === 'textarea') return `<textarea data-rk="${k}" style="min-height:90px">${esc(value || '')}</textarea>`;
  if (m.type === 'enum') return `<select data-rk="${k}">${(m.options || []).map(o => `<option value="${esc(o)}" ${String(value) === String(o) ? 'selected' : ''}>${esc(o === '' ? '（默认 / 留空）' : ((m.optionLabels || {})[o] || o))}</option>`).join('')}</select>`;
  return `<input type="text" style="flex:1;min-width:200px" data-rk="${k}" value="${esc(value == null ? '' : value)}">`;
}
async function renderRoomCfg() {
  const S = App.S;
  const rooms = (S.rooms || []).filter(r => r.isGroup !== false).slice();
  for (const g of S.allowGroups || []) if (!rooms.some(r => r.roomId === g)) rooms.push({ roomId: g, roomName: '', allowed: true, msgs: 0, overrideCount: 0 });
  if (!rooms.length) {
    view.innerHTML = ui.pageHd('🎭', '每群性格', '') + ui.empty('还没有群', '等群里来条消息，或者先在「群与人」里配白名单');
    return;
  }
  const pick = (roomCfgState.room && rooms.some(r => r.roomId === roomCfgState.room)) ? roomCfgState.room : rooms[0].roomId;
  roomCfgState.room = pick;
  view.innerHTML = ui.pageHd('🎭', '每群性格', '每个群单独调。动哪一项，那一项就变成"本群自定义"；没动过的跟随全局') +
    `<div class="rc-wrap"><div class="card rc-list" style="padding:10px">${rooms.map(r => `<div class="rc-row${r.roomId === pick ? ' on' : ''}" data-room="${esc(r.roomId)}">
        <span class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">👥 ${esc(r.roomName || r.roomId)}</span><span class="tiny muted" data-rcount>${r.overrideCount ? r.overrideCount + ' 项' : '跟随全局'}</span></div>`).join('')}</div>
      <div class="card rc-edit" id="rc-edit">${ui.loading()}</div></div>`;
  $$('.rc-list .rc-row').forEach(el => el.onclick = () => { roomCfgState.room = el.dataset.room; renderRoomCfg(); });
  await loadRoomCfg(pick);
}
const RC_SECTIONS = [
  ['人设与称呼', ['persona', 'masterName', 'aliases']],
  ['回复节奏', ['replyProbability', 'alwaysReply', 'minReplyGapMs', 'maxRepliesPer10Min', 'debounceMs', 'cannedChance', 'repeatWindowMs', 'quietHours', 'quietAllowAt']],
  ['说话方式', ['delayScale', 'splitChance', 'maxLines', 'maxReplyChars', 'allowAt', 'atMentionChance', 'lengthSpread', 'moodEnabled', 'humanize', 'humanizeDropPeriod', 'pokeOnMe', 'pokeBack', 'pokeChance', 'pokeOnReply']],
  ['表情 / 识图 / 联网 / 视频', ['stickerChance', 'visionOnImage', 'visionOnEmoticon', 'webSearch', 'videoOnMessage', 'linkVideo', 'videoRemember']],
  ['更多玩法', ['games', 'polls', 'reminders', 'linkSummary', 'docOnFile', 'bondEnabled', 'diaryEnabled']],
  ['主动找人', ['proactive', 'proactiveIdleMs', 'proactiveMinGapMs', 'proactiveChance', 'proactiveHours']],
  ['记忆', ['contextMessages', 'historyLookup', 'historyLimit', 'memoryExtract', 'memoryExtractEvery', 'factsLimit', 'profileEvery']],
  ['记忆增强', ['archiveSearch', 'archiveSearchLimit', 'personCards', 'personCardChars', 'dailySummaryDays', 'followUp']],
];
async function loadRoomCfg(room) {
  const box = $('#rc-edit'); if (!box) return;
  let d;
  try { d = await api('/room-config?room=' + encodeURIComponent(room)); }
  catch (e) { box.innerHTML = ui.error('读取失败：' + e.message); return; }
  const meta = META();
  const keys = d.keys || [];
  const ovSet = new Set(Object.keys(d.override || {}));
  const keySet = new Set(keys);
  const used = new Set();
  const sections = RC_SECTIONS.map(([title, list]) => { const ks = list.filter(k => keySet.has(k)); ks.forEach(k => used.add(k)); return [title, ks]; }).filter(([, ks]) => ks.length);
  const rest = keys.filter(k => !used.has(k));
  if (rest.length) sections.push(['其他', rest]);
  const field = (k) => {
    const m = meta[k] || { label: k, type: 'text' };
    const on = ovSet.has(k);
    return `<div class="field rc-field${m.type === 'textarea' ? ' wide' : ''}" data-kk="${k}" data-on="${on ? 1 : 0}" data-label="${esc((m.label || k) + ' ' + k)}">
      <div><div class="lab">${esc(m.label || k)}<span class="tag-changed" data-tagon ${on ? '' : 'hidden'}>本群自定义</span></div>
        <div class="help" data-inh>${on ? '全局是：' + esc(valText(k, d.global[k])) : '跟随全局：' + esc(valText(k, d.global[k]))}</div></div>
      <div class="ctl">${roomInput(k, m, on ? d.override[k] : d.global[k])}<button class="link" data-revert="${k}" ${on ? '' : 'hidden'}>↩ 改回跟随全局</button></div></div>`;
  };
  box.innerHTML = `<div class="rc-hd"><div class="row"><b style="font-size:15.5px">👥 ${esc(d.roomName || d.room)}</b><span class="small muted" id="rc-count"></span><span class="grow"></span>
      <input type="search" id="rc-q" placeholder="搜参数" style="width:150px;height:32px">
      <label class="hswitch" title="只看本群单独设置过的项">只看自定义 <span class="sw"><input type="checkbox" id="rc-onlyov"><i></i></span></label>
      <button class="btn sm" id="rc-reset">全部改回跟随</button><button class="btn primary sm" id="rc-save">保存本群</button></div></div>
    <div id="rc-body">${sections.map(([title, ks]) => `<details class="rc-sec" data-sec="${esc(title)}" ${ks.some(k => ovSet.has(k)) || title === '人设与称呼' ? 'open' : ''}>
        <summary>${esc(title)}<span class="tiny muted" data-seccount></span></summary>${ks.map(field).join('')}</details>`).join('')}</div>`;
  const setCount = () => {
    const el = $('#rc-count'); if (el) el.textContent = ovSet.size ? '· 自定义 ' + ovSet.size + ' 项' : '· 全部跟随全局';
    $$('.rc-sec').forEach(sec => {
      const ks = (sections.find(([t]) => t === sec.dataset.sec) || [null, []])[1];
      const n = ks.filter(k => ovSet.has(k)).length;
      const tag = sec.querySelector('[data-seccount]'); if (tag) tag.textContent = n ? '（' + n + ' 项自定义）' : '';
    });
  };
  const applyFilter = () => {
    const only = $('#rc-onlyov') && $('#rc-onlyov').checked;
    const q = String(($('#rc-q') || {}).value || '').trim().toLowerCase();
    $$('.rc-field').forEach(el => { el.style.display = (only && el.dataset.on !== '1') || (q && !el.dataset.label.toLowerCase().includes(q)) ? 'none' : ''; });
    if (only || q) $$('.rc-sec').forEach(s => { s.open = true; });
  };
  const mark = (k, on) => {
    const row = box.querySelector(`[data-kk="${k}"]`); if (!row) return;
    if (on) ovSet.add(k); else ovSet.delete(k);
    row.dataset.on = on ? '1' : '0';
    const inh = row.querySelector('[data-inh]'); if (inh) inh.textContent = (on ? '全局是：' : '跟随全局：') + valText(k, d.global[k]);
    const rv = row.querySelector('[data-revert]'); if (rv) rv.hidden = !on;
    const tg = row.querySelector('[data-tagon]'); if (tg) tg.hidden = !on;
    applyFilter(); setCount();
  };
  keys.forEach(k => {
    const inp = box.querySelector(`[data-kk="${k}"] [data-rk]`); if (!inp) return;
    const m = meta[k] || {};
    inp.addEventListener(m.type === 'bool' || m.type === 'enum' ? 'change' : 'input', () => mark(k, true));
  });
  $$('[data-revert]', box).forEach(b => b.onclick = () => {
    const k = b.dataset.revert;
    const inp = box.querySelector(`[data-kk="${k}"] [data-rk]`);
    const m = meta[k] || {};
    if (inp) {
      if (m.type === 'bool') inp.checked = !!d.global[k];
      else if (m.type === 'csv') inp.value = Array.isArray(d.global[k]) ? d.global[k].join(', ') : String(d.global[k] || '');
      else inp.value = d.global[k] == null ? '' : d.global[k];
    }
    mark(k, false);
  });
  $('#rc-onlyov').onchange = applyFilter;
  $('#rc-q').oninput = applyFilter;
  setCount();
  $('#rc-save').onclick = async () => {
    const overrides = {};
    for (const k of ovSet) {
      const inp = box.querySelector(`[data-kk="${k}"] [data-rk]`); if (!inp) continue;
      const m = meta[k] || {};
      if (m.type === 'bool') overrides[k] = inp.checked;
      else if (m.type === 'number') overrides[k] = Number(inp.value);
      else if (m.type === 'csv') overrides[k] = inp.value.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean);
      else overrides[k] = inp.value;
    }
    try {
      const r = await busy('#rc-save', () => api('/room-config', { method: 'POST', body: JSON.stringify({ room: d.room, overrides }) }));
      toast(`已保存：本群自定义 ${r.count} 项` + (r.ok ? '' : '（有被拒的项）'), r.ok ? 'ok' : 'err');
      if (r.ok) flashSaved($('#rc-save'));
      const c = document.querySelector(`.rc-row[data-room="${d.room}"] [data-rcount]`); if (c) c.textContent = r.count ? r.count + ' 项' : '跟随全局';
      setCount();
    } catch (e) { toast('保存失败：' + e.message, 'err'); }
  };
  $('#rc-reset').onclick = async () => {
    if (!(await uiConfirm('全部改回跟随全局？', '这个群单独设置过的 ' + ovSet.size + ' 项都会恢复成跟随全局。', { okText: '全部改回', danger: true }))) return;
    try {
      await api('/room-config', { method: 'POST', body: JSON.stringify({ room: d.room, reset: true }) });
      toast('已恢复跟随全局', 'ok');
      const c = document.querySelector(`.rc-row[data-room="${d.room}"] [data-rcount]`); if (c) c.textContent = '跟随全局';
      await loadRoomCfg(d.room);
    } catch (e) { toast('失败：' + e.message, 'err'); }
  };
}

/* ═════════════════ 手动操作：像聊天窗口一样 ═════════════════ */
function renderManual() {
  const S = App.S;
  // 私聊会话不能当群发（服务端会拒），这里只列已授权的群
  const rooms = (S.rooms || []).filter(r => r.isGroup !== false && r.allowed !== false);
  if (!App.manualRoom || !rooms.some(r => r.roomId === App.manualRoom)) App.manualRoom = (rooms[0] || {}).roomId || '';
  view.innerHTML = ui.pageHd('🕹', '手动操作', '直接以机器人身份发一句、让它生成一句、回放自测（都会真的发到群里）',
      `<select id="m-room">${rooms.map(r => `<option value="${esc(r.roomId)}"${r.roomId === App.manualRoom ? ' selected' : ''}>${esc(r.roomName || r.roomId)}</option>`).join('') || '<option value="">（还没有群）</option>'}</select>
       <button class="btn" id="m-reconnect">🔌 重连 SnowLuma</button>`) +
    `<div class="card"><div class="card-hd">💬 这个群最近的消息 <span class="muted">发出去的也会出现在这里</span></div><div class="chat" id="m-chat"></div>
      <hr class="sep">
      <div class="row"><input type="text" id="m-say" style="flex:1;min-width:240px" placeholder="直接以机器人身份发送（不走模型）"><button class="btn" id="m-say-btn">发送</button></div>
      <div class="row" style="margin-top:10px"><input type="text" id="m-ask" style="flex:1;min-width:240px" placeholder="给它一句提示，让它生成一句并发送（测延迟）"><button class="btn primary" id="m-ask-btn">✨ 生成并发送</button></div>
      <div class="row" style="margin-top:10px"><button class="btn" id="m-selftest">🔁 回放最近一条别人的消息（会真的回复）</button><span class="small muted" id="m-hint"></span></div></div>`;
  const room = () => App.manualRoom;
  const notes = [];
  const paintChat = () => {
    const box = $('#m-chat'); if (!box) return;
    const r = (App.S.rooms || []).find(x => x.roomId === room());
    const msgs = ((r && r.recent) || []).map(m => Object.assign({}, m));
    const all = msgs.concat(notes).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    box.innerHTML = all.length ? all.map(m => m.note ? `<div class="tiny muted" style="text-align:center;margin:4px 0">${esc(m.note)}</div>` : msgHtml(m, false)).join('') : ui.empty('这个群最近没有消息');
    box.scrollTop = box.scrollHeight;
  };
  const after = async (note) => {
    notes.push({ note, ts: Date.now() });
    await refresh({ lite: true });
    paintChat();
  };
  const hint = (t) => { const el = $('#m-hint'); if (el) el.textContent = t; };
  $('#m-room').onchange = (e) => { App.manualRoom = e.target.value; notes.length = 0; paintChat(); };
  $('#m-reconnect').onclick = async () => {
    try { await busy('#m-reconnect', () => action('reconnect')); toast('已重连', 'ok'); refresh(); }
    catch (err) { toast('重连失败：' + err.message, 'err'); }
  };
  $('#m-say-btn').onclick = async () => {
    const text = $('#m-say').value.trim(); if (!text) return;
    try { await busy('#m-say-btn', () => action('say', { room: room(), text })); $('#m-say').value = ''; toast('已发送', 'ok'); after('— 你让它发了一句 —'); }
    catch (e) { toast('发送失败：' + e.message, 'err'); }
  };
  $('#m-say').onkeydown = (e) => { if (e.key === 'Enter') $('#m-say-btn').click(); };
  $('#m-ask-btn').onclick = async () => {
    const prompt = $('#m-ask').value.trim();
    hint('生成中…');
    try {
      const r = await busy('#m-ask-btn', () => action('ask', { room: room(), prompt }));
      hint(`首字 ${r.firstTokenMs}ms · 总 ${r.totalMs}ms`);
      $('#m-ask').value = '';
      after(`— 生成并发送：首字 ${r.firstTokenMs}ms · 总 ${r.totalMs}ms —`);
    } catch (e) { hint('失败：' + e.message); }
  };
  $('#m-selftest').onclick = async () => {
    hint('回放中…');
    try {
      const j = await busy('#m-selftest', () => api('/action', { method: 'POST', body: JSON.stringify({ op: 'selftest', args: { room: room() } }) }));
      const res = j.result || {};
      hint(res.from ? '回放了：' + res.from : '完成');
      after('— 回放自测' + (res.totalMs ? '：总 ' + res.totalMs + 'ms' : '') + ' —');
    } catch (e) { hint('失败：' + e.message); }
  };
  paintChat();
}

/* ═════════════════ 启动 ═════════════════ */
/* 顶栏「刷新」：重载插件（应用磁盘上的代码 / 配置改动），随后刷新页面拿新客户端包 */
$('#h-refresh').onclick = async () => {
  if (!(await leaveGuard())) return;
  if (!(await uiConfirm('重载插件？', '会用磁盘上的最新代码与配置重启机器人，连接会中断约 2 秒。', { icon: '🔄', okText: '重载' }))) return;
  try {
    await action('reloadPlugin');
    toast('正在重载…页面会在 4 秒后自动刷新', 'ok');
    setTimeout(() => { location.reload(); }, 4000);
  } catch (e) { toast('重载失败：' + e.message, 'err'); }
};
$('#pills-mini').onclick = (e) => {
  e.stopPropagation();
  const open = $('#pills').classList.toggle('open');
  $('#pills-mini').setAttribute('aria-expanded', String(open));
};
$('#qq-panel').addEventListener('click', (e) => {
  // 窄窗口下点别处：收起状态弹层、导航下拉
  if (!(e.target.closest && e.target.closest('#nav, #nav-toggle'))) $('#nav').classList.remove('open');
  if (e.target.closest && e.target.closest('#pills, #pills-mini')) return;
  $('#pills').classList.remove('open');
  $('#pills-mini').setAttribute('aria-expanded', 'false');
});
$('#m-enabled').onchange = async (e) => {
  const want = e.target.checked;
  if (!(await leaveGuard())) { e.target.checked = !want; return; }
  try { await api('/config', { method: 'POST', body: JSON.stringify({ patch: { enabled: want } }) }); toast(want ? '已开启自动回复' : '已关闭自动回复', 'ok'); refresh(); }
  catch (err) { e.target.checked = !want; toast('失败：' + err.message, 'err'); }
};
$('#m-dry').onchange = async (e) => {
  const want = e.target.checked;
  if (!(await leaveGuard())) { e.target.checked = !want; return; }
  try { await api('/config', { method: 'POST', body: JSON.stringify({ patch: { dryRun: want } }) }); toast(want ? '演练模式' : '正常发送', 'ok'); refresh(); }
  catch (err) { e.target.checked = !want; toast('失败：' + err.message, 'err'); }
};

/* 小鲸鱼、界面 emoji → 线条图标、深浅主题、图表悬停气泡 */
const brandWhale = $('#brand-whale');
if (brandWhale) brandWhale.innerHTML = whale('calm', 28);
view.className = '';
view.innerHTML = `<div class="boot">${whale('swim', 110)}<div class="bt">正在读取 QQ 机器人状态…</div></div>`;
detectTone();
iconize($('#qq-panel'));
new MutationObserver((muts) => {
  for (const m of muts) {
    for (const n of m.addedNodes) {
      if (n.nodeType === 1) iconize(n);
      else if (n.nodeType === 3 && n.parentElement && n.parentElement.matches(ICON_SEL)) iconizeEl(n.parentElement);
    }
  }
}).observe($('#qq-panel'), { childList: true, subtree: true });
bindTips();
// DSH 切主题时（html / body 上的 class、style、data-* 会变）重新看一眼深浅
if (window.__qqpanelToneObs) window.__qqpanelToneObs.disconnect();
window.__qqpanelToneObs = new MutationObserver(() => detectTone());
window.__qqpanelToneObs.observe(document.documentElement, { attributes: true });
if (document.body) window.__qqpanelToneObs.observe(document.body, { attributes: true });
if (!window.__qqpanelToneMq) {
  window.__qqpanelToneMq = true;
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => detectTone()); } catch { /* 老浏览器没有 */ }
}

renderNav();
refresh().then(() => refreshTodo());
(window.__qqpanelTimers = window.__qqpanelTimers || []).push(
  // 页面在后台（切走标签页 / 最小化）时不刷新；切回来立刻补一次
  setInterval(() => { if (!document.hidden && App.tab === 'overview') refresh({ lite: true }); }, 5000),
  setInterval(() => { if (!document.hidden) refreshTodo(); }, 60000),
);
if (!window.__qqpanelVisBound) {
  window.__qqpanelVisBound = true;
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && App.tab === 'overview') refresh({ lite: true });
  });
}
